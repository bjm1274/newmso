name = "erp-pchos"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"

[vars]
NEXT_PUBLIC_R2_PUBLIC_BASE_URL = "https://r2.pchos.kr"

# 데이터 백엔드 선택 (Phase 2~7 cutover)
# 'supabase'   : 기존 동작 — write/read 모두 Supabase
# 'dual-write' : write를 Supabase + D1 양쪽에. 진실은 Supabase, D1 실패는 alert
# 'd1'         : 최종 컷오버 후 — D1만 사용 (서버 mirror는 D1 binding 직접 사용)
# Phase 3 컷오버 (2026-05-17): backfill 완료 후 dual-write 활성화.
# Phase 7 컷오버 (2026-05-17): 'd1' 활성화. 클라이언트는 lib/supabase.ts의
#   ENABLE_D1_CLIENT=true로 /api/d1/query·/api/d1/mutate 라우팅.
#   서버 mirror 헬퍼는 dual-write 모드 동작 그대로 (D1 binding 직접 사용).
# 롤백 시 'dual-write'로 환원 + lib/supabase.ts ENABLE_D1_CLIENT=false 후 재배포.
DATA_BACKEND = "dual-write"

# Firebase Cloud Messaging (FCM) — 모바일 푸시 알림
# 모두 NEXT_PUBLIC_* 접두사라 클라이언트 번들에 노출됨 (정상 — Firebase Console 도메인 화이트리스트로 보호).
# FIREBASE_SERVICE_ACCOUNT(server-only secret)는 `wrangler secret put`으로 별도 등록.
NEXT_PUBLIC_FIREBASE_API_KEY = "AIzaSyBGqA18_a00XlYSRvoRu2KpdKfVJHJnikA"
NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = "mso-system.firebaseapp.com"
NEXT_PUBLIC_FIREBASE_PROJECT_ID = "mso-system"
NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET = "mso-system.firebasestorage.app"
NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "873459384687"
NEXT_PUBLIC_FIREBASE_APP_ID = "1:873459384687:web:4fd03a6b1090683a58689a"
NEXT_PUBLIC_FCM_VAPID_KEY = "BCk7ISKIUPeXrOw0GwuRH4a8zBHKdKospS3rCQc5CWxiI8ukae0gJ5wE7Svn1RDOWsFTadEUdxlFu1R_HVJ5izQ"
# Web Push (VAPID) 구독용 공개키 — FCM VAPID와 별개 시스템
NEXT_PUBLIC_VAPID_PUBLIC_KEY = "BMf4VkZmz6KBu1gqZSPypXMmYurULhlG31-m0F-GO-dH9fkBHkFeyyFLOqcd86M0sRQGxG_eBc7aXsF3yynxMww"

# Cron Triggers
# Daily full backup stays paused to avoid unnecessary Supabase egress.
[triggers]
crons = [
  "0 17 * * *",   # /api/cron/chat-retention
  "0 23 * * *",   # /api/cron/chat-push-dispatch
  "0 8 * * *",    # /api/cron/leave-notice-announcements
  "0 3 * * *",    # /api/cron/push-subscription-cleanup (+ runLicenseExpiryJobs 통합)
  "0 0 * * *",    # /api/cron/unread-notification-repush (KST 09:00 — 안 읽은 공지/결재 1회 재알림)
]

# Cloudflare D1 binding (Supabase → D1 마이그레이션, Phase 1C)
# 사용: env.DB 로 접근 → getD1Drizzle(env.DB)로 Drizzle 클라이언트 생성
[[d1_databases]]
binding = "DB"
database_name = "pchos-d1"
database_id = "e6e054c7-2bba-4a97-a740-b39a42906a74"
