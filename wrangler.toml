name = "erp-pchos"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# main 은 OpenNext 가 생성한 .open-next/worker.js 를 감싸는 래퍼(cloudflare-worker.ts).
# 래퍼가 fetch 는 그대로 위임하고 scheduled() 를 추가해 [triggers] crons 가 실제로 동작하게 한다.
# (이전에는 .open-next/worker.js 직접 지정 → scheduled 핸들러 부재로 cron 5개 전부 무동작 버그)
main = "cloudflare-worker.ts"
account_id = "462cf9a8da5cfd0edfdca833e2443e19"


workers_dev = true

routes = [
  { pattern = "erp.pchos.kr", custom_domain = true }
]

[assets]
directory = ".open-next/assets"

[vars]
NEXT_PUBLIC_R2_PUBLIC_BASE_URL = "https://r2.pchos.kr"

# 데이터 백엔드 선택 (Cloudflare D1 컷오버 고정 완료)
# 프로젝트는 이제 Supabase를 영구 배제하며, 오직 Cloudflare D1(SQLite)만을 사용합니다.
DATA_BACKEND = "d1"

# Firebase Cloud Messaging (FCM) — 모바일 푸시 알림
# 모두 NEXT_PUBLIC_* 접두사라 클라이언트 번들에 노출됨 (정상 — Firebase Console 도메인 화이트리스트로 보호).
# FIREBASE_SERVICE_ACCOUNT(server-only secret)는 `wrangler secret put`으로 별도 등록.
NEXT_PUBLIC_FIREBASE_API_KEY = "AIzaSyBGqA18_a00XlYSRvoRu2KpdKfVJHJnikA"
NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = "mso-system.firebaseapp.com"
NEXT_PUBLIC_FIREBASE_PROJECT_ID = "mso-system"
NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET = "mso-system.firebasestorage.app"
NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "873459384687"
NEXT_PUBLIC_FIREBASE_APP_ID = "1:873459384687:web:4fd03a6b1090683a58689a"
NEXT_PUBLIC_FCM_VAPID_KEY = "BCk7ISKIUPeXrOw0GwuRH4a8zBHKdKospS3rCQc5CWxiI8ukae0gJ5wE7Svn1RDOWsFTadEUdxlFu1R_HVJ5izQ"
# Web Push (VAPID) 구독용 공개키 — FCM VAPID와 별개 시스템
NEXT_PUBLIC_VAPID_PUBLIC_KEY = "BMf4VkZmz6KBu1gqZSPypXMmYurULhlG31-m0F-GO-dH9fkBHkFeyyFLOqcd86M0sRQGxG_eBc7aXsF3yynxMww"

# Cron Triggers
# Daily full backup (KST 00:00 = UTC 15:00) using D1 (no Supabase egress)
[triggers]
crons = [
  "*/5 * * * *",  # /api/cron/chat-push-dispatch
  "0 15 * * *",   # /api/cron/backup
  "0 17 * * *",   # /api/cron/chat-retention
  "0 3 * * *",    # /api/cron/push-subscription-cleanup
  "0 0 * * *",    # KST 09:00 — unread-repush, leave-announcements, etc.
]

# Cloudflare D1 binding (Supabase → D1 마이그레이션, Phase 1C)
# 사용: env.DB 로 접근 → getD1Drizzle(env.DB)로 Drizzle 클라이언트 생성
[[d1_databases]]
binding = "DB"
database_name = "pchos-d1-v2"
database_id = "4576c96e-7d63-4103-946e-75fcee3c0b20"
migrations_dir = "lib/db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "pchos-files"

[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1_realtime_hub"
new_sqlite_classes = [ "RealtimeHub" ]
