user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    # Gzip 압축
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # WebSocket 프록시 설정
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ====================================================
    # 1. HTTP 80 (HTTPS 자동 리다이렉트 & ACME 갱신)
    # ====================================================
    server {
        listen 80;
        server_name pchos.kr www.pchos.kr erp.pchos.kr allerp.kr localhost 161.33.162.195 _;

        # Let's Encrypt 자동 갱신 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # IP 직접 접속 시에도 안전한 HTTPS AllERP 도메인으로 리다이렉트
        location / {
            if ($host = "161.33.162.195") {
                return 301 https://erp.pchos.kr$request_uri;
            }
            return 301 https://$host$request_uri;
        }
    }

    # ====================================================
    # 2. HTTPS 443 - 메인 홈페이지 (pchos.kr, www.pchos.kr)
    # ====================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name pchos.kr www.pchos.kr;

        ssl_certificate /etc/letsencrypt/live/pchos.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pchos.kr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /var/www/homepage;
        index index.html;

        # 정적 자산 캐싱
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA 라우팅 지원
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 에러 페이지
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ====================================================
    # 3. HTTPS 443 - AllERP 시스템 (erp.pchos.kr, allerp.kr)
    # ====================================================
    server {
        listen 443 ssl;
        # HTTP/1.1 only: browsers' WebSocket upgrade is 1.1. http2 on 이면
        # 일부 클라이언트에서 /api/realtime/ws 가 404 로 떨어진다.
        server_name erp.pchos.kr allerp.kr;

        ssl_certificate /etc/letsencrypt/live/pchos.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pchos.kr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # WebSocket — 카카오톡급 유지: 버퍼링 끄고 24시간 idle 허용
        location /api/realtime/ws {
            proxy_pass http://allerp-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
        }

        location / {
            proxy_pass http://allerp-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # 헬스체크
        location /api/health {
            proxy_pass http://allerp-app:3000/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
