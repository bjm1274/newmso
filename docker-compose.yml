services:
  allerp-app:
    container_name: allerp-app
    build:
      context: .
      dockerfile: Dockerfile
    image: allerp:latest
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    container_name: allerp-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./homepage/dist:/var/www/homepage:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - allerp-app
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
