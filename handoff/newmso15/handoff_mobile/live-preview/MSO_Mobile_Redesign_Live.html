<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MSO 모바일 리디자인 라이브 프리뷰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="mobile/m-tokens.css" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F5F5F7; min-height: 100vh; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #18181B;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.012em;
  }
  #root { min-height: 100vh; }

  /* 캔버스 자체 배경 */
  .dc-stage { background: #F5F5F7 !important; }
</style>
</head>
<body>

<div id="root"></div>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- starter components -->
<script type="text/babel" src="mobile/design-canvas.jsx"></script>
<script type="text/babel" src="mobile/ios-frame.jsx"></script>

<!-- mobile components + screens -->
<script type="text/babel" src="mobile/m-components.jsx"></script>
<script type="text/babel" src="mobile/m-screens-1.jsx"></script>
<script type="text/babel" src="mobile/m-screens-2.jsx"></script>
<script type="text/babel" src="mobile/m-screens-hr.jsx"></script>
<script type="text/babel" src="mobile/m-screens-stock.jsx"></script>
<script type="text/babel" src="mobile/m-screens-admin.jsx"></script>
<script type="text/babel" src="mobile/m-screens-extras.jsx"></script>
<script type="text/babel" src="mobile/m-screens-addon-details.jsx"></script>
<script type="text/babel" src="mobile/m-screens-addon-modules.jsx"></script>
<script type="text/babel" src="mobile/m-screens-forms.jsx"></script>

<!-- canvas app (last, depends on all above) -->
<script type="text/babel" src="mobile/m-canvas.jsx"></script>

</body>
</html>
