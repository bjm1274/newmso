<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MSO PC 리디자인 라이브 프리뷰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  /* ─────────────────────────────── BASE ─────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: light;
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;

    /* zinc neutral (정식 1셋) */
    --z-50: #FAFAFB;
    --z-100: #F4F4F5;
    --z-150: #EEEEF1;
    --z-200: #E4E4E7;
    --z-300: #D4D4D8;
    --z-400: #A1A1AA;
    --z-500: #71717A;
    --z-600: #52525B;
    --z-700: #3F3F46;
    --z-800: #27272A;
    --z-900: #18181B;

    /* brand */
    --accent: #2563EB;
    --accent-700: #1D4ED8;
    --accent-soft: #EBF2FF;
    --accent-tint: rgba(37,99,235,0.08);

    /* state */
    --success: #10B981;
    --success-soft: #ECFDF5;
    --warning: #F59E0B;
    --warning-soft: #FFFBEB;
    --danger: #EF4444;
    --danger-soft: #FEF2F2;

    /* shell (앱 안쪽) — BEFORE / AFTER 토큰 */
    /* AFTER values default */
    --body-fs: 14px;
    --body-lh: 1.55;
    --h1-fs: 22px;
    --h1-fw: 800;
    --section-fs: 16px;
    --section-fw: 800;
    --caption-fs: 12px;
    --kpi-num-fs: 28px;
    --btn-h: 36px;
    --btn-h-sm: 30px;
    --btn-h-lg: 40px;
    --page-pad-x: 32px;
    --section-gap: 24px;
    --card-pad: 20px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --radius-2xl: 14px;
    --row-h: 40px;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.03);
    --shadow-pop: 0 8px 24px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
    --border: #E9E9EC;
    --border-strong: #D4D4D8;
  }
  html[data-mode="before"] {
    --body-fs: 13px;
    --body-lh: 1.5;
    --h1-fs: 17px;
    --h1-fw: 700;
    --section-fs: 14px;
    --section-fw: 700;
    --caption-fs: 11px;
    --kpi-num-fs: 24px;
    --btn-h: 32px;
    --btn-h-sm: 28px;
    --btn-h-lg: 36px;
    --page-pad-x: 20px;
    --section-gap: 16px;
    --card-pad: 16px;
    --radius-md: 8px;
    --radius-lg: 8px;
    --radius-2xl: 12px;
    --row-h: 44px;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  }

  html, body { background: #ECEDEF; color: var(--z-900); font-family: var(--font); word-break: keep-all; }
  body { font-size: 13px; line-height: 1.5; letter-spacing: -0.012em; -webkit-font-smoothing: antialiased; padding-bottom: 80px; }

  /* preview chrome (관리 UI) */
  .preview-bar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    background: #FFFFFF; border-bottom: 1px solid #E4E4E7;
    backdrop-filter: blur(8px);
  }
  .preview-bar .pv-title {
    font-size: 13px; font-weight: 800; letter-spacing: -0.015em;
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap;
  }
  .preview-bar .pv-title .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }
  .preview-bar .pv-sub { font-size: 11px; color: var(--z-500); font-weight: 600; white-space: nowrap; }
  .preview-bar .pv-spacer { flex: 1; }
  .seg {
    display: inline-flex; padding: 3px; background: var(--z-100); border-radius: 999px; gap: 2px;
  }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    padding: 6px 14px; font-size: 12px; font-weight: 700; letter-spacing: -0.01em;
    border-radius: 999px; color: var(--z-600); font-family: var(--font);
    white-space: nowrap;
  }
  .seg button.on { background: #fff; color: var(--z-900); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .pv-meta {
    font-size: 11px; color: var(--z-500); font-weight: 600; font-family: var(--mono);
    padding: 6px 10px; background: var(--z-100); border-radius: 8px;
    white-space: nowrap;
  }

  /* device frame */
  .frame-wrap { padding: 24px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
  .frame {
    width: 1440px; max-width: 100%;
    background: #FFFFFF;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .frame-meta {
    display: flex; gap: 10px; font-size: 11px; color: var(--z-500); font-weight: 600;
    width: 1440px; max-width: 100%; padding: 0 4px;
  }
  .frame-meta .tag {
    padding: 4px 10px; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 999px;
    white-space: nowrap;
  }
  .frame-meta .tag.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  /* ─────────────────────────────── SHELL ─────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: 72px auto 1fr;
    height: 820px;
    background: var(--z-50);
    font-size: var(--body-fs);
    line-height: var(--body-lh);
  }

  /* 1차 사이드바 — 72px (변경 없음 — improvement doc §02 결정사항) */
  .sidebar1 {
    width: 72px;
    background: #FFFFFF;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0 16px;
    gap: 4px;
  }
  .brand {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(180deg, #1D4ED8, #2563EB);
    color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 0.02em;
    display: grid; place-items: center;
    margin-bottom: 8px;
  }
  .s1-bell {
    width: 36px; height: 36px; display: grid; place-items: center; color: var(--z-500); position: relative; cursor: pointer; margin-bottom: 4px;
  }
  .s1-bell::after { content: ""; position: absolute; top: 6px; right: 8px; width: 6px; height: 6px; border-radius: 999px; background: var(--danger); }
  .s1-item {
    width: 56px; padding: 8px 0; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--z-500); cursor: pointer; transition: background .15s;
  }
  .s1-item:hover { background: var(--z-100); color: var(--z-900); }
  .s1-item.on { background: var(--accent); color: #fff; }
  .s1-item .lbl { font-size: 10px; font-weight: 700; letter-spacing: -0.04em; white-space: nowrap; word-break: keep-all; }
  .s1-foot { margin-top: auto; }
  .s1-avatar {
    width: 32px; height: 32px; border-radius: 999px;
    background: var(--z-200); color: var(--z-700); font-weight: 800;
    display: grid; place-items: center; font-size: 12px;
  }

  /* 2차 사이드바 — 220px (개선안: 192 → 220) */
  .sidebar2 {
    width: 100%;
    background: #FFFFFF; border-right: 1px solid var(--border);
    padding: 16px 8px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* 채팅은 원래 폭 (대화 레이아웃 당 낣도록 넓게) */
  aside.sidebar2.chat-side { padding: 10px 8px; }
  html[data-mode="before"] .sidebar2 { padding: 12px 8px; }
  .s2-title { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; padding: 0 6px; }
  html[data-mode="before"] .s2-title { font-size: 13px; font-weight: 700; }
  .s2-sub { font-size: 11px; color: var(--z-500); font-weight: 600; padding: 0 6px; margin-top: 2px; }
  .s2-group-lbl {
    margin: 16px 6px 6px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--z-400); text-transform: uppercase;
  }
  html[data-mode="before"] .s2-group-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
  .s2-card {
    margin-top: 12px; padding: 12px 12px;
    background: var(--z-50); border: 1px solid var(--border); border-radius: 12px;
    cursor: pointer;
  }
  .s2-card.on { background: var(--accent-soft); border-color: transparent; }
  .s2-card .ico-row { display: flex; align-items: center; gap: 8px; }
  .s2-card .ico { width: 28px; height: 28px; border-radius: 8px; background: #fff; display: grid; place-items: center; color: var(--accent); border: 1px solid var(--border); }
  .s2-card.on .ico { background: var(--accent); color: #fff; border-color: transparent; }
  .s2-card .ctitle { font-size: 13px; font-weight: 700; letter-spacing: -0.015em; color: var(--z-900); }
  .s2-card .csub { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--z-500); font-weight: 600; }
  .s2-card .csub .pill { padding: 2px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--border); font-size: 10px; font-weight: 700; color: var(--z-600); }
  .s2-card.on .csub .pill { background: var(--accent); color: #fff; border-color: transparent; }

  .s2-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; color: var(--z-700);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .s2-item:hover { background: var(--z-100); }
  .s2-item.on { background: var(--accent-tint); color: var(--accent); font-weight: 700; }

  .s2-foot { margin-top: auto; display: grid; gap: 8px; padding-top: 12px; }
  .s2-foot select {
    width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--font); font-size: 12px; padding: 0 8px; color: var(--z-700); background: #FFF;
  }

  /* main */
  .main { overflow: auto; }

  /* page header */
  .pageheader {
    background: #FFFFFF; border-bottom: 1px solid var(--border);
    padding: 18px var(--page-pad-x); display: flex; align-items: flex-end; justify-content: space-between;
  }
  .crumb {
    font-size: var(--caption-fs); color: var(--z-500); font-weight: 600;
    letter-spacing: -0.005em;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 2px;
    white-space: nowrap;
  }
  html[data-mode="before"] .crumb { display: none; }
  .crumb .sep { color: var(--z-300); }
  .h1-row { display: flex; align-items: center; gap: 12px; }
  .h1 { font-size: var(--h1-fs); font-weight: var(--h1-fw); letter-spacing: -0.025em; line-height: 1.2; white-space: nowrap; }
  .chip {
    padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    background: var(--accent-soft); color: var(--accent);
    white-space: nowrap;
  }
  .chip.warn { background: var(--warning-soft); color: var(--warning); }
  .chip.success { background: var(--success-soft); color: var(--success); }
  .chip.muted { background: var(--z-100); color: var(--z-600); }
  .sub {
    margin-top: 4px; font-size: var(--caption-fs); color: var(--z-500); font-weight: 500;
    white-space: nowrap;
  }
  .ph-right { display: flex; gap: 8px; align-items: center; }

  /* toolbar — 탭 형식 (전문 근태 통합 관리 화면 기준) */
  .tabs {
    display: flex; gap: 4px; padding: 8px var(--page-pad-x); background: #FFFFFF; border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .tab {
    height: var(--btn-h); padding: 0 14px; border-radius: 8px;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--z-600); cursor: pointer; border: 1px solid transparent;
    background: transparent;
    white-space: nowrap;
  }
  .tab:hover { background: var(--z-100); color: var(--z-900); }
  .tab.on { background: var(--accent-soft); color: var(--accent); }
  .tab-spacer { flex: 1; }

  /* buttons */
  .btn {
    height: var(--btn-h); padding: 0 14px; border-radius: var(--radius-md);
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; font-family: var(--font);
    cursor: pointer; border: 1px solid var(--border); background: #FFF; color: var(--z-700);
    white-space: nowrap;
  }
  .btn:hover { background: var(--z-50); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.primary:hover { background: var(--accent-700); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .btn.sm { height: var(--btn-h-sm); padding: 0 10px; font-size: 12px; }
  .btn.lg { height: var(--btn-h-lg); padding: 0 18px; font-size: 14px; }
  .btn.icon { padding: 0; width: var(--btn-h); justify-content: center; }

  /* content layout */
  .content { padding: var(--section-gap) var(--page-pad-x); display: grid; gap: var(--section-gap); }

  /* card */
  .card {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: var(--card-pad);
    box-shadow: var(--shadow-xs);
  }
  .card .ctitle { font-size: var(--section-fs); font-weight: var(--section-fw); letter-spacing: -0.02em; white-space: nowrap; }
  .card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

  /* ─────────────────────────────── 출퇴근 ─────────────────────────────── */
  .att-hero {
    background: linear-gradient(135deg, #0B0B0E, #1A1A21);
    color: #fff;
    border-radius: var(--radius-2xl);
    padding: 26px 28px;
    display: grid; grid-template-columns: 1fr auto;
    gap: 24px; align-items: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    position: relative; overflow: hidden;
  }
  .att-hero::before {
    content:''; position: absolute; right: -80px; bottom: -120px;
    width: 320px; height: 320px; border-radius: 999px;
    background: radial-gradient(circle, rgba(37,99,235,0.35), transparent 70%);
  }
  .att-hero-left { position: relative; z-index: 1; }
  .att-date { font-size: 12px; font-weight: 700; color: #A1A1AA; letter-spacing: -0.005em; }
  .att-time {
    margin-top: 6px;
    display: flex; align-items: baseline; gap: 10px; color: #fff;
    font-feature-settings: "tnum";
  }
  .att-time .ampm { font-size: 18px; font-weight: 700; color: #A1A1AA; letter-spacing: -0.01em; }
  .att-time .hms  { font-size: 44px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.0; }
  .att-time .sec  { font-size: 26px; color: #71717A; font-weight: 700; }
  .att-status {
    margin-top: 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; color: #D4D4D8;
  }
  .att-status .status-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--danger); box-shadow: 0 0 0 4px rgba(239,68,68,0.18); }
  .att-status .status-label { font-weight: 800; color: #fff; }
  .att-status .status-sep { color: #52525B; }
  .att-status .status-loc { color: #A1A1AA; }
  .att-status .status-loc b { color: #fff; font-weight: 800; font-feature-settings: "tnum"; }
  .att-status .status-ok {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 4px; padding: 3px 8px;
    background: rgba(16,185,129,0.16); color: #34D399;
    border-radius: 999px; font-size: 11px; font-weight: 800;
  }
  .att-hero-right { position: relative; z-index: 1; text-align: center; }
  .att-cta {
    background: var(--accent); color: #fff; border: 0;
    height: 56px; padding: 0 28px; border-radius: 14px;
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font); font-size: 16px; font-weight: 800; letter-spacing: -0.015em;
    cursor: pointer; box-shadow: 0 6px 14px rgba(37,99,235,0.35);
  }
  .att-cta:hover { background: var(--accent-700); }
  .att-cta-sub { margin-top: 8px; font-size: 11px; font-weight: 600; color: #71717A; }
  html[data-mode="before"] .att-hero { background: #0B0B0E; padding: 22px 24px; border-radius: 10px; box-shadow: none; }
  html[data-mode="before"] .att-hero::before { display: none; }
  html[data-mode="before"] .att-time .hms { font-size: 36px; }
  html[data-mode="before"] .att-cta { height: 48px; font-size: 14px; box-shadow: none; border-radius: 10px; }

  .att-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  /* 차트 */
  .att-chart {
    margin-top: 14px;
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px;
    align-items: end;
    height: 180px; padding: 0 0 8px;
  }
  .att-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  .att-bar-track {
    position: relative; flex: 1; width: 100%; max-width: 36px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  }
  .att-bar-fill {
    width: 100%; border-radius: 6px 6px 0 0; min-height: 4px;
    transition: height .3s ease;
  }
  .att-bar-val {
    font-size: 10px; font-weight: 800; color: var(--z-600); font-feature-settings: "tnum";
    margin-bottom: 4px;
  }
  .att-bar-day { font-size: 11px; font-weight: 700; color: var(--z-500); font-feature-settings: "tnum"; }
  .att-legend {
    display: flex; gap: 12px; font-size: 11px; font-weight: 700; color: var(--z-600);
  }
  .att-legend .ld-dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 4px; vertical-align: -1px; }
  html[data-mode="before"] .att-chart { height: 120px; }
  html[data-mode="before"] .att-bar-val { display: none; }

  /* 히스토리 */
  .att-month {
    display: inline-flex; align-items: center; gap: 4px;
    height: 32px; padding: 0 4px; border-radius: 8px;
    border: 1px solid var(--border); background: #FFF;
  }
  .att-mo-btn {
    width: 24px; height: 24px; border: 0; background: transparent; cursor: pointer;
    color: var(--z-600); font-size: 16px; font-weight: 700; font-family: var(--font);
    border-radius: 6px;
  }
  .att-mo-btn:hover { background: var(--z-100); color: var(--z-900); }
  .att-mo-lbl { font-size: 13px; font-weight: 800; padding: 0 6px; font-feature-settings: "tnum"; }

  .att-history { display: grid; gap: 8px; margin-top: 4px; }
  .att-row {
    display: grid; grid-template-columns: 60px 1fr auto auto;
    align-items: center; gap: 16px;
    padding: 12px 14px;
    background: var(--z-50); border: 1px solid var(--border); border-radius: var(--radius-md);
  }
  .att-row:hover { background: #FFF; border-color: var(--border-strong); }
  .att-date-badge {
    width: 60px; padding: 8px 4px; border-radius: 10px; text-align: center;
    font-feature-settings: "tnum"; background: #FFF; border: 1px solid var(--border);
  }
  .att-date-badge .dm { font-size: 10px; font-weight: 700; color: var(--z-500); }
  .att-date-badge .dd { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; color: var(--z-900); margin-top: 2px; }
  .att-date-badge.tone-warn    { background: var(--warning-soft); border-color: transparent; }
  .att-date-badge.tone-warn .dm,
  .att-date-badge.tone-warn .dd { color: var(--warning); }
  .att-date-badge.tone-danger  { background: var(--danger-soft); border-color: transparent; }
  .att-date-badge.tone-danger .dm,
  .att-date-badge.tone-danger .dd { color: var(--danger); }
  .att-date-badge.tone-success { background: var(--success-soft); border-color: transparent; }
  .att-date-badge.tone-success .dm,
  .att-date-badge.tone-success .dd { color: var(--success); }
  .att-date-badge.tone-muted   { background: var(--z-100); border-color: transparent; }
  .att-date-badge.tone-muted .dm,
  .att-date-badge.tone-muted .dd { color: var(--z-500); }

  .att-row-mid { display: flex; flex-direction: column; gap: 2px; }
  .att-row-dow { font-size: 13px; font-weight: 700; color: var(--z-900); letter-spacing: -0.01em; }
  .att-row-status { font-size: 11px; font-weight: 700; letter-spacing: -0.01em; }
  .att-row-status.tone-warn    { color: var(--warning); }
  .att-row-status.tone-danger  { color: var(--danger); }
  .att-row-status.tone-success { color: var(--success); }
  .att-row-status.tone-muted   { color: var(--z-500); }

  .att-row-times { display: flex; gap: 24px; font-feature-settings: "tnum"; }
  .t-block { text-align: right; }
  .t-lbl { font-size: 10px; font-weight: 700; color: var(--z-500); letter-spacing: 0.04em; }
  .t-val { font-size: 14px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900); margin-top: 2px; white-space: nowrap; }

  /* ─────────────────────────────── 할일 ─────────────────────────────── */
  .todo-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 14px; border-radius: 999px;
    background: #FFF; border: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: var(--z-700); cursor: pointer;
    font-family: var(--font); white-space: nowrap;
    transition: all .15s;
  }
  .todo-chip:hover { background: var(--z-50); }
  .todo-chip .cnt {
    display: inline-grid; place-items: center;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: var(--z-100); color: var(--z-600);
    font-size: 11px; font-weight: 800; font-feature-settings: "tnum";
  }
  .todo-chip.on { background: var(--z-900); color: #fff; border-color: transparent; }
  .todo-chip.on .cnt { background: rgba(255,255,255,0.18); color: #fff; }
  .todo-chip.tone-danger.on { background: var(--danger); }
  .todo-chip.tone-warn.on   { background: var(--warning); }
  .todo-chip.tone-muted.on  { background: var(--z-500); }

  .todo-quickadd {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 12px 14px;
    display: grid; grid-template-columns: 18px 1fr auto auto;
    align-items: center; gap: 12px;
    box-shadow: var(--shadow-xs);
  }
  .todo-input {
    border: 0; outline: 0; background: transparent;
    font-family: var(--font); font-size: 14px; font-weight: 500; color: var(--z-900);
  }
  .todo-input::placeholder { color: var(--z-400); }
  .todo-quick-meta {
    display: flex; gap: 10px;
    font-size: 11px; font-weight: 700; color: var(--z-500);
    padding-right: 8px; border-right: 1px solid var(--border);
  }
  .todo-quick-meta span { display: inline-flex; align-items: center; gap: 4px; }

  .todo-list { display: grid; gap: 6px; }
  .todo-row {
    display: grid; grid-template-columns: 18px 56px 1fr auto auto;
    align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: var(--radius-md);
    background: var(--z-50); border: 1px solid var(--border); cursor: pointer;
  }
  .todo-row:hover { background: #FFF; border-color: var(--border-strong); }
  .todo-check { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .pri-pill {
    display: inline-flex; align-items: center; justify-content: center;
    height: 22px; padding: 0 8px; border-radius: 999px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.02em;
  }
  .pri-pill.tone-danger { background: var(--danger-soft); color: var(--danger); }
  .pri-pill.tone-warn   { background: var(--warning-soft); color: var(--warning); }
  .pri-pill.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .pri-pill.tone-muted  { background: var(--z-100); color: var(--z-500); }
  .todo-title { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; color: var(--z-900); }
  .todo-meta {
    display: flex; gap: 14px; font-size: 11px; color: var(--z-500); font-weight: 600;
  }
  .todo-meta span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

  .empty-pad {
    padding: 48px 24px; text-align: center;
    background: var(--z-50); border-radius: var(--radius-md);
  }
  .empty-ico {
    width: 48px; height: 48px; margin: 0 auto 14px;
    border-radius: 14px; background: #FFF; border: 1px dashed var(--border-strong);
    display: grid; place-items: center; color: var(--z-400);
  }
  .empty-title { font-size: 14px; font-weight: 800; color: var(--z-900); }
  .empty-sub { margin-top: 4px; font-size: 12px; color: var(--z-500); }

  /* ─────────────────────────────── 서류제출 ─────────────────────────────── */
  .docs-hero {
    background: linear-gradient(135deg, #F5F0FF, #EAE3FF);
    border-radius: var(--radius-2xl); padding: 22px 24px;
    display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
    border: 1px solid #DDD0FF;
  }
  .dh-kicker { font-size: 11px; font-weight: 800; color: #7C3AED; letter-spacing: 0.02em; }
  .dh-title { margin-top: 2px; font-size: 20px; font-weight: 800; letter-spacing: -0.025em; color: var(--z-900); }
  .dh-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .dh-meta .small { color: var(--z-600); }
  .dh-sub { margin-top: 6px; font-size: 12px; color: var(--z-600); }
  .dh-right { display: flex; gap: 8px; }
  html[data-mode="before"] .docs-hero { background: #F5F0FF; border-radius: 10px; padding: 18px; }
  html[data-mode="before"] .dh-title { font-size: 17px; }

  .docs-stat { display: flex; flex-direction: column; gap: 2px; }
  .ds-lbl { font-size: 11px; font-weight: 700; color: var(--z-500); letter-spacing: -0.005em; }
  .ds-val { font-size: 20px; font-weight: 800; letter-spacing: -0.025em; font-feature-settings: "tnum"; line-height: 1.0; margin-top: 2px; }
  .ds-tot { font-size: 13px; font-weight: 700; color: var(--z-500); }
  .docs-progress {
    height: 6px; background: var(--z-100); border-radius: 999px; overflow: hidden;
  }
  .dp-fill { height: 100%; background: linear-gradient(90deg, #10B981, #34D399); }

  .docs-scan-banner {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    background: var(--accent-soft); border: 1px solid #C7DAFE; border-radius: var(--radius-md);
  }
  .dsb-ico {
    width: 36px; height: 36px; border-radius: 10px;
    background: #FFF; color: var(--accent);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .dsb-title { font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
  .dsb-sub { font-size: 12px; color: var(--z-700); margin-top: 1px; }

  .docs-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  }
  html[data-mode="before"] .docs-grid { grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .doc-card {
    background: #FFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 4px;
    transition: all .15s;
  }
  .doc-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-xs); }
  .doc-card.submitted { background: #FAFCFB; border-color: #DCEFE3; }
  .dc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .dc-ico {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
  }
  .doc-card.submitted .dc-ico { background: var(--success-soft); color: var(--success); }
  .dc-label { font-size: 13px; font-weight: 800; color: var(--z-900); letter-spacing: -0.015em; word-break: keep-all; }
  .dc-sub { font-size: 11px; color: var(--z-500); font-weight: 600; }
  .dc-actions { display: flex; gap: 6px; margin-top: 10px; }
  .dc-act {
    flex: 1; height: 30px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent); border: 0;
    font-family: var(--font); font-size: 11px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  .dc-act:nth-child(2) { background: var(--warning-soft); color: var(--warning); }
  .dc-act:hover { filter: brightness(0.96); }

  /* ─────────────────────────────── 알림 ─────────────────────────────── */
  .alert-stat { display: flex; flex-direction: column; gap: 2px; }
  .as-val { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.0; font-feature-settings: "tnum"; color: var(--z-900); }
  .as-lbl { font-size: 11px; font-weight: 700; color: var(--z-500); }

  .alert-section-lbl {
    font-size: 11px; font-weight: 800; color: var(--z-500); letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 4px 6px;
  }
  .alert-list { display: grid; gap: 6px; }
  .alert-row {
    display: grid; grid-template-columns: 40px 1fr auto;
    gap: 14px; align-items: center;
    padding: 14px 16px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md);
  }
  .alert-row.unread { background: #FAFCFF; border-color: #DCE6FF; }
  .alert-row:hover { border-color: var(--border-strong); }
  .alert-ico {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--z-100); color: var(--z-600);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .alert-ico.kind-chat     { background: var(--accent-soft); color: var(--accent); }
  .alert-ico.kind-approval { background: var(--warning-soft); color: var(--warning); }
  .alert-ico.kind-hr       { background: #F3E8FF; color: #7C3AED; }
  .alert-ico.kind-stock    { background: var(--success-soft); color: var(--success); }
  .alert-row1 { display: flex; align-items: center; gap: 8px; }
  .alert-kind { font-size: 11px; font-weight: 800; color: var(--z-700); }
  .alert-sep  { color: var(--z-300); }
  .alert-from { font-size: 12px; color: var(--z-600); font-weight: 600; }
  .alert-from b { font-weight: 800; color: var(--z-900); }
  .alert-dot-unread { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); margin-left: 2px; }
  .alert-msg {
    margin-top: 4px; font-size: 13px; color: var(--z-700);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    word-break: keep-all;
  }
  .alert-right { text-align: right; white-space: nowrap; }
  .alert-time { font-size: 11px; color: var(--z-500); font-weight: 700; font-feature-settings: "tnum"; }
  .alert-link {
    height: 26px; padding: 0 10px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent); border: 0;
    font-family: var(--font); font-size: 11px; font-weight: 800; cursor: pointer;
    white-space: nowrap;
  }
  .alert-link.mute { background: var(--z-100); color: var(--z-600); }
  .alert-link:hover { filter: brightness(0.96); }

  /* refresh icon — add path if not in icons.jsx */
  /* home footer (로그아웃·정보수정) — 원본 위치 */
  .home-foot {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 4px 0;
  }

  /* ─────────────────────────────── 추가기능 (Add-on) ─────────────────────────────── */
  /* 모든 모듈의 PageHeader 제목/서브 라인은 숨김 — 우측 액션만 노출 */
  .addon-pageheader { display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 4px 0; flex-wrap: wrap; }
  .addon-pageheader > div:first-child { display: none; }
  /* 허브 hero, 부서별 재고 컨텍스트 배너, 사이드바 sub 모두 숨김 */
  .addon-hero { display: none; }
  .inv-ctx-banner { display: none; }
  aside.sidebar2 .s2-sub { display: none; }

  .addon-h1 { font-size: var(--h1-fs); font-weight: var(--h1-fw); letter-spacing: -0.025em; }
  .addon-sub { margin-top: 4px; font-size: var(--caption-fs); color: var(--z-500); font-weight: 500; }

  /* hub */
  .addon-hero {
    background: linear-gradient(135deg, #EEF4FF, #F8FBFF);
    border: 1px solid #DCE6FF;
    border-radius: var(--radius-2xl);
    padding: 28px 32px;
  }
  .ah-kicker { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 0.06em; }
  .ah-title  { margin-top: 4px; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
  .ah-title b { background: linear-gradient(135deg, #2563EB, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .ah-sub    { margin-top: 6px; font-size: 14px; color: var(--z-600); max-width: 680px; }
  html[data-mode="before"] .addon-hero { background: var(--accent-soft); border-radius: 8px; padding: 18px; }
  html[data-mode="before"] .ah-title { font-size: 18px; }
  html[data-mode="before"] .ah-title b { -webkit-text-fill-color: var(--z-900); background: none; }

  .addon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .addon-card {
    position: relative;
    padding: 20px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    cursor: pointer; transition: all .15s;
    box-shadow: var(--shadow-xs);
  }
  .addon-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.06); }
  .ac-ico {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center; margin-bottom: 14px;
  }
  .ac-ico.ico-inventory { background: var(--accent-soft); color: var(--accent); }
  .ac-ico.ico-opcheck   { background: #ECFDF5; color: var(--success); }
  .ac-ico.ico-handoff   { background: #FFF7ED; color: #F97316; }
  .ac-ico.ico-closing   { background: #FAF5FF; color: #7C3AED; }
  .ac-ico.ico-eval      { background: #FFFBEB; color: var(--warning); }
  .ac-ico.ico-discharge { background: #FDF2F8; color: #DB2777; }
  .ac-label { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .ac-desc { margin-top: 4px; font-size: 12px; color: var(--z-500); font-weight: 600; }
  .ac-chev { position: absolute; top: 20px; right: 20px; color: var(--z-300); }
  .addon-card:hover .ac-chev { color: var(--accent); }

  /* summary row */
  .addon-summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi-ico.danger { background: var(--danger-soft); color: var(--danger); }

  /* toolbar */
  .addon-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--z-50);
  }

  /* data table */
  .data-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-tbl th, .data-tbl td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .data-tbl th { background: #FAFAFB; font-size: 11px; font-weight: 800; color: var(--z-500); letter-spacing: 0.02em; text-transform: none; position: sticky; top: 0; z-index: 2; }
  .data-tbl tbody tr:hover { background: var(--z-50); }
  .data-tbl tbody tr:last-child td { border-bottom: 0; }
  .data-tbl.flat th { background: transparent; }
  .data-tbl.flat td { border-bottom: 1px dashed var(--border); }
  html[data-mode="before"] .data-tbl th { font-size: 10px; padding: 10px 12px; }
  html[data-mode="before"] .data-tbl td { padding: 8px 12px; font-size: 12px; }

  /* OP체크 */
  .op-stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .op-stat {
    background: #FFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow-xs);
  }
  .ops-lbl { font-size: 12px; font-weight: 700; color: var(--z-500); }
  .ops-v   { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; font-feature-settings:"tnum"; line-height: 1.0; }
  .ops-u   { font-size: 12px; font-weight: 700; color: var(--z-500); margin-left: 2px; }
  .op-stat.tone-warn   { border-left: 3px solid var(--warning); }
  .op-stat.tone-accent { border-left: 3px solid var(--accent); }
  .op-stat.tone-danger { border-left: 3px solid var(--danger); }
  .op-stat.tone-success{ border-left: 3px solid var(--success); }

  .op-split { display: grid; grid-template-columns: 160px 1fr; gap: 12px; }
  .op-list {
    background: #FFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .op-list-head { padding: 8px 8px; border-bottom: 1px solid var(--border); background: var(--z-50); }
  .op-list-head .todo-chip { padding: 0 8px; height: 24px; font-size: 11px; }
  .op-list-head .todo-chip .cnt { font-size: 10px; padding: 0 4px; }
  .op-list-body { padding: 6px; display: grid; gap: 4px; }
  .op-card {
    padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #FFF; cursor: pointer;
    transition: all .15s;
  }
  .op-card:hover { border-color: var(--border-strong); background: var(--z-50); }
  .op-card.on { border-color: var(--accent); background: var(--accent-soft); }
  .op-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .op-name { font-size: 13px; font-weight: 800; letter-spacing: -0.015em; }
  .op-time { font-size: 11px; font-weight: 800; color: var(--accent); font-feature-settings: "tnum"; }
  .op-card-sub {
    margin-top: 2px; font-size: 10px; color: var(--z-600); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    overflow: hidden; text-overflow: ellipsis;
  }
  .op-card-meta { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 10px; color: var(--z-500); }
  .op-card-meta > span:not(.chip) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op-card-meta .chip { margin-left: auto; padding: 1px 6px; font-size: 9px; flex-shrink: 0; }

  .op-detail { display: grid; gap: 12px; align-content: start; }
  .op-steps { display: flex; align-items: center; margin: 14px 0; }
  .op-step { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 80px; }
  .ops-num {
    width: 32px; height: 32px; border-radius: 999px;
    background: var(--z-100); color: var(--z-500);
    display: grid; place-items: center; font-size: 13px; font-weight: 800;
  }
  .op-step.on .ops-num { background: var(--accent); color: #fff; }
  .op-step.done .ops-num { background: var(--success); color: #fff; }
  .op-step .ops-name { font-size: 11px; font-weight: 700; color: var(--z-500); }
  .op-step.on .ops-name, .op-step.done .ops-name { color: var(--z-900); }
  .op-line { flex: 1; height: 2px; background: var(--z-200); }
  .op-line.done { background: var(--success); }

  .op-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .op-check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .op-check-list { display: grid; gap: 6px; }
  .op-check-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px;
    background: var(--z-50); cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .op-check-item input { accent-color: var(--accent); }
  .op-add-row {
    margin-top: 4px; padding: 10px 12px; border-radius: 8px;
    border: 1px dashed var(--border-strong); background: transparent;
    display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--z-500);
    font-family: var(--font); font-size: 12px;
  }
  .op-soft-row { display: flex; gap: 6px; align-items: center; }
  .op-inline-input {
    flex: 1; height: 32px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #FFF;
    font-family: var(--font); font-size: 13px;
  }
  .op-inline-input.sm { max-width: 80px; }
  .op-stepper {
    width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
    background: #FFF; color: var(--z-700); font-weight: 800; cursor: pointer; font-size: 13px;
  }
  .op-qty { min-width: 28px; text-align: center; font-weight: 800; font-feature-settings:"tnum"; }
  .op-textarea {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: #FFF;
    font-family: var(--font); font-size: 13px; line-height: 1.55;
    color: var(--z-900); resize: vertical;
  }
  .op-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

  /* 병동 인계 */
  .ho-split { display: grid; grid-template-columns: 380px 1fr; gap: 12px; }
  .ho-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .ho-cal-h {
    text-align: center; font-size: 10px; font-weight: 800; color: var(--z-500); padding: 6px 0;
  }
  .ho-cal-d {
    height: 38px; display: grid; place-items: center;
    border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--z-700); cursor: pointer;
    font-feature-settings: "tnum";
  }
  .ho-cal-d:hover { background: var(--z-100); }
  .ho-cal-d.past { color: var(--z-400); }
  .ho-cal-d.on { background: var(--accent); color: #fff; }
  .ho-mini-stat { padding: 10px 12px; background: var(--z-50); border-radius: 10px; }
  .ho-mini-lbl { font-size: 10px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; }
  .ho-mini-v   { font-size: 18px; font-weight: 800; margin-top: 2px; letter-spacing: -0.02em; font-feature-settings:"tnum"; }
  .ho-list { display: grid; gap: 6px; }
  .ho-item {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    padding: 12px 14px; border-radius: 8px; background: var(--z-50); border: 1px solid var(--border);
  }
  .ho-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ho-body { font-size: 13px; color: var(--z-800); }
  .ho-right { flex-shrink: 0; }

  /* 마감보고 */
  .cl-list { display: grid; gap: 8px; }
  .cl-row {
    display: grid; grid-template-columns: 140px 1fr auto auto auto;
    gap: 18px; align-items: center;
    padding: 14px 18px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
  }
  .cl-row:hover { border-color: var(--border-strong); }
  .cl-date { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; font-feature-settings:"tnum"; }
  .cl-total { display: flex; flex-direction: column; gap: 2px; }
  .cl-total-v { font-size: 16px; font-weight: 800; font-feature-settings:"tnum"; color: var(--z-900); }
  .cl-writer { display: flex; flex-direction: column; gap: 2px; text-align: right; }
  .cl-writer b { font-size: 13px; }

  .cl-field { display: flex; flex-direction: column; gap: 6px; }
  .cl-field label { font-size: 12px; font-weight: 800; color: var(--z-700); }
  .cl-field .req { color: var(--danger); }
  .cl-empty { padding: 20px; text-align: center; color: var(--z-500); font-size: 12px; }

  .cl-summary {
    background: linear-gradient(135deg, #0B0B0E, #1A1A21);
    color: #fff; border-radius: var(--radius-2xl); padding: 22px 28px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cls-lbl { font-size: 11px; font-weight: 800; color: #A1A1AA; letter-spacing: 0.06em; }
  .cls-val { margin-top: 4px; font-size: 38px; font-weight: 800; letter-spacing: -0.035em; font-feature-settings:"tnum"; line-height: 1.0; }
  .cls-u   { font-size: 18px; color: #71717A; margin-left: 4px; }
  .cls-val.ok { color: #34D399; }
  html[data-mode="before"] .cl-summary { background: #0B0B0E; border-radius: 10px; padding: 18px; }
  html[data-mode="before"] .cls-val { font-size: 28px; }
  .cl-submit {
    background: var(--z-900); color: #fff; border: 0; height: 56px;
    border-radius: var(--radius-2xl); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font); font-size: 15px; font-weight: 800; letter-spacing: -0.015em;
  }
  .cl-submit:hover { background: #000; }

  /* 직원평가 */
  .ev-split { display: grid; grid-template-columns: 280px 1fr; gap: 12px; }
  .ev-list-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .ev-list { padding: 8px; max-height: 540px; overflow: auto; display: grid; gap: 2px; }
  .ev-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
  }
  .ev-row:hover { background: var(--z-50); }
  .ev-row.on { background: var(--accent-soft); }
  .ev-avatar {
    width: 32px; height: 32px; border-radius: 999px;
    background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -0.01em;
    flex-shrink: 0;
  }
  .ev-avatar.big { width: 56px; height: 56px; font-size: 22px; }
  .ev-name { font-size: 13px; font-weight: 800; }
  .ev-team { font-size: 11px; color: var(--z-500); font-weight: 600; margin-top: 1px; }

  .ev-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
  .ev-h-name { font-size: 18px; font-weight: 800; letter-spacing: -0.025em; display: flex; align-items: center; gap: 8px; }
  .ev-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ev-type-chip {
    height: 32px; padding: 0 14px; border-radius: 999px;
    background: #FFF; border: 1px solid var(--border);
    font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--z-700);
    cursor: pointer; white-space: nowrap;
  }
  .ev-type-chip.on { background: var(--accent); color: #fff; border-color: transparent; }
  .ev-slider { flex: 1; accent-color: var(--accent); }
  .ev-score { font-size: 28px; font-weight: 800; color: var(--accent); font-feature-settings: "tnum"; min-width: 26px; text-align: center; }

  .ev-history { display: grid; gap: 6px; }
  .ev-hist-row {
    display: grid; grid-template-columns: auto auto 1fr auto; gap: 14px; align-items: center;
    padding: 10px 14px; border-radius: 8px; background: var(--z-50);
  }
  .ev-hist-score { font-size: 14px; letter-spacing: -0.04em; color: var(--warning); }
  .ev-hist-body { font-size: 12px; color: var(--z-700); }

  /* 퇴원심사 */
  .dc-list { display: grid; gap: 8px; }
  .dc-row {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 18px; box-shadow: var(--shadow-xs);
  }
  .dc-row:hover { border-color: var(--border-strong); }
  .dc-row-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dc-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .dc-frac { font-feature-settings:"tnum"; font-size: 12px; color: var(--z-500); font-weight: 600; }
  .dc-frac b { color: var(--accent); font-size: 14px; }
  .dc-bar { height: 6px; background: var(--z-100); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .dc-bar-fill { height: 100%; background: linear-gradient(90deg, #2563EB, #60A5FA); }

  .dc-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .dc-tpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .dc-tpl-card { padding: 14px 16px; background: var(--z-50); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .dc-tpl-name { font-size: 14px; font-weight: 800; letter-spacing: -0.015em; margin-bottom: 4px; }

  /* ──────── 조직도 (원본 디자인 — 부서별 표) ──────── */
  .org-tree { display: grid; gap: 16px; }
  .org-dept { background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-xs); }
  .org-dept-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: var(--z-50); border-bottom: 1px solid var(--border);
  }
  .org-dept-name { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
  .org-tbl th { background: transparent; font-size: 10px; }
  .org-tbl td { padding: 10px 16px; }
  .org-avatar-sm {
    width: 24px; height: 24px; border-radius: 999px;
    background: var(--z-200); color: var(--z-700);
    display: grid; place-items: center; font-weight: 800; font-size: 11px;
    flex-shrink: 0;
  }

  /* ──────── 조직도 (hierarchical org chart) ──────── */
  .org-hospital {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 22px; box-shadow: var(--shadow-xs);
    margin-bottom: 18px;
  }
  .org-hosp-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .org-hosp-name { font-size: 18px; font-weight: 800; letter-spacing: -0.025em; }
  .org-hosp-sub { margin-top: 2px; font-size: 12px; color: var(--z-500); }
  .org-hosp-tag {
    padding: 4px 10px; border-radius: 999px;
    background: var(--z-100); color: var(--z-500);
    font-size: 10px; font-weight: 800; letter-spacing: 0.04em;
  }
  .org-top { display: flex; justify-content: center; margin-top: 22px; }
  .org-tree-line {
    width: 2px; height: 18px; background: var(--z-200); margin: 0 auto;
  }
  .org-managers {
    background: var(--z-50); border-radius: 12px; padding: 12px 16px;
    max-width: 540px; margin: 0 auto;
  }
  .org-managers-label {
    font-size: 11px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em;
    text-align: center; margin-bottom: 8px;
  }
  .org-managers-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .org-depts {
    display: grid; grid-template-columns: 2.4fr 0.8fr 1.6fr 0.7fr; gap: 12px;
    margin-top: 12px;
  }
  .org-dept-group {
    border-radius: 14px; overflow: hidden; border: 1px solid;
  }
  .org-dept-group.tone-blue        { background: #EBF2FF; border-color: #C7DAFE; }
  .org-dept-group.tone-blue .org-dept-band { background: #2563EB; color: #fff; }
  .org-dept-group.tone-orange      { background: #FFF7ED; border-color: #FED7AA; }
  .org-dept-group.tone-orange .org-dept-band { background: #F97316; color: #fff; }
  .org-dept-group.tone-violet      { background: #FAF5FF; border-color: #DDD6FE; }
  .org-dept-group.tone-violet .org-dept-band { background: #8B5CF6; color: #fff; }
  .org-dept-group.tone-green-light { background: #ECFDF5; border-color: #BBF7D0; }
  .org-dept-group.tone-green-light .org-dept-band { background: #10B981; color: #fff; padding: 8px 12px; }

  .org-dept-band {
    padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  }
  .org-dept-band-name { font-size: 14px; font-weight: 800; letter-spacing: -0.02em; }
  .org-dept-band-count { font-size: 11px; font-weight: 700; opacity: 0.9; }
  .org-dept-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; padding: 10px; }
  .org-dept-empty {
    padding: 30px 10px; text-align: center; color: var(--z-500); font-size: 12px; font-weight: 600;
  }

  .org-team {
    background: #FFFFFF; border-radius: 10px; overflow: hidden; border: 1px solid rgba(0,0,0,0.04);
  }
  .org-team-head {
    padding: 8px 12px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .org-team-head.tone-cyan   { background: #06B6D4; color: #fff; }
  .org-team-head.tone-gray   { background: #71717A; color: #fff; }
  .org-team-head.tone-green  { background: #10B981; color: #fff; }
  .org-team-head.tone-pink   { background: #EC4899; color: #fff; }
  .org-team-head.tone-purple { background: #A855F7; color: #fff; }
  .org-team-head.tone-orange { background: #F97316; color: #fff; }
  .org-team-head.tone-plain  { background: #FFFFFF; color: var(--z-900); border-bottom: 1px solid var(--border); }
  .org-team-name { font-size: 13px; font-weight: 800; letter-spacing: -0.015em; }
  .org-team-count { font-size: 10px; font-weight: 700; opacity: 0.9; }
  .org-team-body { padding: 6px; display: grid; gap: 4px; }

  .org-emp {
    display: flex; align-items: center; gap: 6px;
    padding: 6px; border-radius: 8px; background: #FAFAFB;
  }
  .org-emp:hover { background: #fff; box-shadow: 0 0 0 1px var(--border); }
  .org-emp-pic {
    position: relative; width: 28px; height: 28px; border-radius: 999px;
    background: linear-gradient(135deg, #94A3B8, #64748B); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 11px;
    flex-shrink: 0;
  }
  .org-emp-pic.lg { width: 40px; height: 40px; font-size: 16px; }
  .org-emp-dot {
    position: absolute; bottom: -1px; right: -1px;
    width: 8px; height: 8px; border-radius: 999px; border: 2px solid #fff;
  }
  .org-emp-dot.on  { background: var(--success); }
  .org-emp-dot.off { background: #FBBF24; }
  .org-emp-info { min-width: 0; }
  .org-emp-name { font-size: 12px; font-weight: 800; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .org-emp-name.big { font-size: 16px; }
  .org-emp-role { font-size: 10px; color: var(--z-500); font-weight: 600; white-space: nowrap; }
  .org-emp-card {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: 10px;
  }
  .org-emp-card.big { padding: 12px 16px; max-width: 260px; }

  .org-add-hospital {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 18px; margin-bottom: 18px;
    background: transparent; border: 1px dashed var(--border-strong); border-radius: var(--radius-lg);
    color: var(--z-500); cursor: pointer;
    font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
  }
  .org-add-hospital:hover { background: #FFF; color: var(--accent); border-color: var(--accent); }

  /* sidebar s2 group divider + tag */
  .s2-group-divider {
    margin: 10px 8px 4px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: 10px; font-weight: 800; color: var(--z-400); letter-spacing: 0.04em; text-transform: uppercase;
  }
  .s2-tag {
    font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 999px; letter-spacing: 0.04em;
    background: var(--z-100); color: var(--z-600); flex-shrink: 0;
  }
  .s2-tag.chart { background: var(--warning-soft); color: var(--warning); }
  .s2-tag.ext   { background: var(--z-100); color: var(--z-500); }

  /* 부서별 재고 — 주(week) 기준 selector */
  .week-seg {
    display: inline-flex; gap: 2px; padding: 2px;
    background: var(--z-100); border-radius: 8px;
  }
  .week-seg button {
    height: 24px; padding: 0 10px; border: 0;
    background: transparent; cursor: pointer;
    font-family: var(--font); font-size: 11px; font-weight: 700;
    color: var(--z-600); border-radius: 6px; white-space: nowrap;
  }
  .week-seg button.on { background: var(--accent); color: #fff; }
  .week-seg button:hover:not(.on) { background: #fff; color: var(--z-900); }

  .inv-setting-footer {
    padding: 14px 18px; background: var(--accent-soft); border-top: 1px solid #C7DAFE;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }

  /* 부서별 재고 컨텍스트 배너 */
  .inv-ctx-banner {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    border-radius: var(--radius-lg);
    border: 1px solid;
  }
  .inv-ctx-banner.mso  { background: linear-gradient(90deg, #FEF3C7, #FEFCE8); border-color: #FDE68A; }
  .inv-ctx-banner.dept { background: linear-gradient(90deg, #EFF6FF, #F0F7FF); border-color: #C7DAFE; }
  .inv-ctx-badge {
    flex-shrink: 0;
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 800; letter-spacing: -0.005em;
    white-space: nowrap;
  }
  .inv-ctx-badge.mso  { background: #F59E0B; color: #fff; }
  .inv-ctx-badge.dept { background: var(--accent); color: #fff; }
  .inv-ctx-title { font-size: 14px; font-weight: 700; color: var(--z-900); }
  .inv-ctx-title b { font-weight: 800; }
  .inv-ctx-sub   { margin-top: 2px; font-size: 12px; color: var(--z-600); }

  /* ──────── 발주서(PO) Sheet ──────── */
  .po-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 200; display: grid; place-items: center;
    padding: 24px; overflow: auto;
    backdrop-filter: blur(4px);
  }
  .po-sheet {
    width: 100%; max-width: 1100px;
    background: #FFFFFF; border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    display: flex; flex-direction: column;
    max-height: calc(100vh - 48px);
  }
  .po-head {
    padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  }
  .po-title { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; margin-top: 4px; }
  .po-close {
    width: 36px; height: 36px; border-radius: 999px;
    border: 0; background: var(--z-100); color: var(--z-700); cursor: pointer;
    display: grid; place-items: center;
  }
  .po-close:hover { background: var(--z-200); }
  .po-summary-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 14px 24px; background: var(--z-50); border-bottom: 1px solid var(--border);
  }
  .po-stat { display: flex; flex-direction: column; gap: 2px; }
  .po-stat-lbl { font-size: 11px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; }
  .po-stat-v { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; font-feature-settings:"tnum"; line-height: 1.0; }
  .po-list { padding: 18px 24px; overflow: auto; flex: 1; display: grid; gap: 14px; }
  .po-vendor {
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    overflow: hidden; background: #FFFFFF;
  }
  .po-vendor-head {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; background: var(--z-50); border-bottom: 1px solid var(--border);
  }
  .po-vendor-head input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
  .po-vendor-name { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
  .po-vendor-total { font-size: 18px; font-weight: 800; font-feature-settings:"tnum"; color: var(--accent); }
  .po-vendor-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; background: var(--z-50); border-top: 1px solid var(--border);
  }
  .po-vendor-note { flex: 1; }
  .po-foot {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 16px 24px; background: var(--z-50); border-top: 1px solid var(--border);
  }

  /* ──────── 근무현황 ──────── */
  .wn-stat-row {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    padding: 14px 16px; background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
  }
  .wn-stat {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
  }
  .wn-dot { width: 8px; height: 8px; border-radius: 999px; }
  .wn-stat.tone-success .wn-dot { background: var(--success); }
  .wn-stat.tone-warn    .wn-dot { background: var(--warning); }
  .wn-stat.tone-danger  .wn-dot { background: var(--danger); }
  .wn-stat.tone-accent  .wn-dot { background: var(--accent); }
  .wn-stat.tone-muted   .wn-dot { background: var(--z-400); }
  .wn-lbl { font-size: 12px; font-weight: 700; color: var(--z-700); }
  .wn-v { margin-left: auto; font-size: 18px; font-weight: 800; font-feature-settings:"tnum"; letter-spacing: -0.025em; }

  .wn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .wn-card {
    position: relative;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 12px 14px 12px 18px;
    display: flex; align-items: center; gap: 12px;
    overflow: hidden;
  }
  .wn-card:hover { border-color: var(--border-strong); }
  .wn-card-stat { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .wn-card-stat.tone-success { background: var(--success); }
  .wn-card-stat.tone-warn    { background: var(--warning); }
  .wn-card-stat.tone-danger  { background: var(--danger); }
  .wn-card-stat.tone-accent  { background: var(--accent); }
  .wn-card-stat.tone-muted   { background: var(--z-300); }
  .wn-name { font-size: 14px; font-weight: 800; letter-spacing: -0.015em; }
  .wn-last { margin-top: 4px; font-size: 11px; color: var(--z-500); font-feature-settings:"tnum"; }
  .chip.success { background: var(--success-soft); color: var(--success); }
  .chip.warn    { background: var(--warning-soft); color: var(--warning); }
  .chip.danger  { background: var(--danger-soft); color: var(--danger); }
  .chip.accent  { background: var(--accent-soft); color: var(--accent); }

  /* ──────── 수술상담 ──────── */
  .cs-split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
  .cs-section { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .cs-section-title { font-size: 13px; font-weight: 800; color: var(--z-900); letter-spacing: -0.015em; margin-bottom: 10px; }
  .cs-doc-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: var(--radius-md);
    background: var(--accent-soft); border: 1px solid #C7DAFE;
  }
  tr.row-active { background: var(--accent-soft); }

  /* ──────── 근무현황 AFTER (시프트 + 캘린더) ──────── */
  .wn-pulse { display: inline-flex; width: 8px; height: 8px; margin-left: 8px; position: relative; }
  .wn-pulse span {
    position: absolute; inset: 0; border-radius: 999px; background: var(--success);
    animation: wnPulse 1.6s ease-out infinite;
  }
  .wn-pulse::after {
    content: ''; position: absolute; inset: 0; border-radius: 999px;
    background: var(--success); opacity: 0.4;
    animation: wnPulseHalo 1.6s ease-out infinite;
  }
  @keyframes wnPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  @keyframes wnPulseHalo { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(2.6); opacity: 0; } }

  .btn.active-toggle {
    height: var(--btn-h); padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--border); background: #FFF; color: var(--z-700);
    font-family: var(--font); font-size: 12.5px; font-weight: 700;
    cursor: pointer; transition: all .15s;
  }
  .btn.active-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active-toggle.on {
    background: var(--success-soft); border-color: #BBF7D0; color: var(--success);
  }

  .wn-chips {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-top: 8px;
  }
  .wn-chip {
    height: 26px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--border); background: #FFF;
    font-family: var(--font); font-size: 12px; font-weight: 700;
    color: var(--z-600); cursor: pointer; transition: all .12s;
  }
  .wn-chip:hover { border-color: var(--accent); color: var(--accent); }
  .wn-chip.on {
    background: var(--accent-tint); border-color: var(--accent);
    color: var(--accent);
  }
  .wn-sync {
    height: 26px; padding: 0 10px; border-radius: 6px;
    display: inline-flex; align-items: center;
    background: var(--z-100); color: var(--z-600);
    font-size: 11.5px; font-weight: 700; font-feature-settings: "tnum";
  }
  .wn-sync.success { background: var(--success-soft); color: var(--success); }

  .wn-section-h {
    margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .wn-section-title {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: var(--section-fs); font-weight: var(--section-fw);
    letter-spacing: -0.02em; color: var(--z-900);
  }
  .wn-section-dot {
    width: 8px; height: 8px; border-radius: 999px; background: var(--success);
    box-shadow: 0 0 0 4px rgba(16,185,129,0.12);
  }
  .wn-section-meta { font-size: 12px; font-weight: 600; color: var(--z-500); margin-left: 6px; }

  .wn-shift-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-top: 10px;
  }
  .wn-shift-card {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 16px;
    box-shadow: var(--shadow-xs);
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
  }
  .wn-shift-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .wn-shift-card.tone-accent::before  { background: var(--accent); }
  .wn-shift-card.tone-warn::before    { background: var(--warning); }
  .wn-shift-card.tone-violet::before  { background: #7C3AED; }
  .wn-shift-card.tone-success::before { background: var(--success); }
  .wn-shift-card.tone-muted::before   { background: var(--z-400); }
  .wn-shift-card.secondary::before    { background: var(--z-300); }

  .wn-shift-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .wn-band-badge {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
    font-size: 10.5px; font-weight: 800; letter-spacing: -0.01em;
    border: 1px solid transparent;
  }
  .wn-band-badge.tone-accent  { background: var(--accent-soft);  color: var(--accent);  border-color: #C7DAFE; }
  .wn-band-badge.tone-warn    { background: var(--warning-soft); color: var(--warning); border-color: #FDE68A; }
  .wn-band-badge.tone-violet  { background: #F3E8FF;             color: #7C3AED;         border-color: #DDD6FE; }
  .wn-band-badge.tone-success { background: var(--success-soft); color: var(--success); border-color: #BBF7D0; }
  .wn-band-badge.tone-muted   { background: var(--z-100);        color: var(--z-600);   border-color: var(--border); }
  .wn-shift-name { margin-top: 6px; font-size: 14.5px; font-weight: 800; letter-spacing: -0.02em; color: var(--z-900); }
  .wn-shift-time { margin-top: 2px; font-size: 11.5px; font-weight: 600; color: var(--z-500); font-feature-settings: "tnum"; }
  .wn-count-pill {
    height: 24px; padding: 0 10px; border-radius: 6px;
    background: var(--success); color: #FFFFFF;
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 11.5px; font-weight: 800; font-feature-settings: "tnum";
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .wn-count-pill.accent { background: var(--accent); }

  .wn-staff-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
  .wn-staff-card {
    background: #FAFAFB; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; min-width: 0;
    transition: border-color .12s;
    overflow: hidden;
  }
  .wn-staff-card:hover { border-color: var(--border-strong); }
  .wn-staff-card.active-now { background: var(--success-soft); border-color: #BBF7D0; }
  .wn-staff-name { font-size: 12.5px; font-weight: 800; color: var(--z-900); letter-spacing: -0.01em; }
  .wn-staff-meta { margin-top: 2px; font-size: 10.5px; font-weight: 600; color: var(--z-500); font-feature-settings: "tnum"; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wn-shift-chips { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 3px; }
  .wn-shift-chip {
    padding: 1px 6px; border-radius: 4px;
    background: var(--z-100); color: var(--z-600); border: 1px solid var(--border);
    font-size: 9.5px; font-weight: 700; letter-spacing: -0.01em;
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .wn-shift-chip.primary {
    background: var(--accent-tint); color: var(--accent); border-color: #C7DAFE;
  }
  .wn-now-tag {
    display: inline-flex; padding: 1px 6px; border-radius: 4px;
    background: var(--success); color: #FFF;
    font-size: 9.5px; font-weight: 800;
  }

  .wn-pager {
    height: 28px; padding: 0 12px; border-radius: 6px;
    border: 1px solid var(--border); background: #FFF;
    font-family: var(--font); font-size: 12px; font-weight: 700;
    color: var(--z-600); cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    transition: all .12s;
  }
  .wn-pager:hover { border-color: var(--accent); color: var(--accent); }
  .wn-month-pill {
    height: 28px; padding: 0 14px; border-radius: 6px;
    display: inline-flex; align-items: center;
    background: var(--accent-soft); color: var(--accent);
    font-size: 12px; font-weight: 800; letter-spacing: -0.01em;
    font-feature-settings: "tnum";
  }

  .wn-cal {
    margin-top: 10px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    padding: 14px;
  }
  .wn-cal-wd {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    margin-bottom: 6px;
  }
  .wn-cal-wd-cell {
    text-align: center; padding: 6px 0;
    font-size: 11px; font-weight: 800; color: var(--z-500);
    letter-spacing: 0.04em;
  }
  .wn-cal-wd-cell.sun { color: var(--danger); }
  .wn-cal-wd-cell.sat { color: var(--accent); }
  .wn-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wn-cal-cell {
    position: relative; min-height: 86px;
    padding: 8px 8px 6px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: 8px;
    text-align: left; font-family: var(--font); cursor: pointer;
    transition: all .12s;
  }
  .wn-cal-cell:hover { border-color: var(--accent); background: var(--accent-soft); }
  .wn-cal-cell.empty { background: transparent; border-color: transparent; cursor: default; min-height: 86px; }
  .wn-cal-cell.empty:hover { background: transparent; border-color: transparent; }
  .wn-cal-cell.selected { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .wn-cal-cell.today { border-color: var(--success); }
  .wn-cal-cell-top { display: flex; align-items: center; justify-content: space-between; }
  .wn-cal-date {
    font-size: 12.5px; font-weight: 800; color: var(--z-900);
    font-feature-settings: "tnum";
  }
  .wn-cal-cell.today .wn-cal-date { color: var(--success); }
  .wn-cal-cell.sun .wn-cal-date { color: var(--danger); }
  .wn-cal-cell.sat .wn-cal-date { color: var(--accent); }
  .wn-cal-count {
    padding: 1px 6px; border-radius: 4px;
    background: var(--z-100); color: var(--z-600);
    font-size: 10px; font-weight: 800; font-feature-settings: "tnum";
  }
  .wn-cal-cell-body {
    margin-top: 10px; font-size: 10.5px; font-weight: 700; color: var(--z-700);
    font-feature-settings: "tnum";
  }
  .wn-cal-today-tag {
    position: absolute; bottom: 4px; right: 6px;
    font-size: 9px; font-weight: 800; color: var(--success);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  .wn-empty {
    grid-column: 1 / -1;
    padding: 32px;
    background: var(--z-50); border: 1px dashed var(--border); border-radius: var(--radius-lg);
    text-align: center;
    font-size: 13px; font-weight: 600; color: var(--z-500);
  }

  .wn-modal-bg {
    position: fixed; inset: 0; z-index: 120;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wn-modal {
    width: 100%; max-width: 1100px; max-height: 90vh;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-2xl);
    box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .wn-modal-h {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
  }
  .wn-modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.025em; color: var(--z-900); }
  .wn-modal-sub { margin-top: 3px; font-size: 12px; font-weight: 600; color: var(--z-500); }
  .wn-modal-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .wn-band-pill {
    height: 26px; padding: 0 10px; border-radius: 6px;
    display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 800;
    font-feature-settings: "tnum";
  }
  .wn-band-pill.tone-accent  { background: var(--accent-soft);  color: var(--accent);  }
  .wn-band-pill.tone-warn    { background: var(--warning-soft); color: var(--warning); }
  .wn-band-pill.tone-violet  { background: #F3E8FF;             color: #7C3AED;         }
  .wn-band-pill.tone-success { background: var(--success-soft); color: var(--success); }
  .wn-band-pill.tone-muted   { background: var(--z-100);        color: var(--z-600);   }
  .wn-modal-body { padding: 18px 22px; overflow-y: auto; }
  .wn-modal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  /* BEFORE 모드에서는 새 컴포넌트 트리가 안 나오지만, 혹시 잔재가 있으면 단정하게 */
  html[data-mode="before"] .wn-shift-grid { grid-template-columns: repeat(3, 1fr); }

  /* ──────── 업무공유 (게시판 서브 — GuideLibrary) ──────── */
  .gl-content { display: grid; gap: var(--section-gap); }

  .gl-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 18px 22px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-2xl);
    box-shadow: var(--shadow-xs);
  }
  .gl-h-eyebrow {
    font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
    color: var(--z-500); text-transform: uppercase;
  }
  .gl-h-title { margin-top: 4px; font-size: var(--h1-fs); font-weight: var(--h1-fw); letter-spacing: -0.025em; }
  .gl-h-sub  { margin-top: 4px; font-size: 13px; font-weight: 500; color: var(--z-500); max-width: 540px; }

  .gl-stat {
    height: 28px; padding: 0 12px; border-radius: 6px;
    display: inline-flex; align-items: center;
    font-size: 12px; font-weight: 800; font-feature-settings: "tnum";
  }
  .gl-stat.tone-accent { background: var(--accent-soft);  color: var(--accent);  }
  .gl-stat.tone-warn   { background: var(--warning-soft); color: var(--warning); }
  .gl-stat.tone-muted  { background: var(--z-100);        color: var(--z-700);   }

  .gl-split {
    display: grid; grid-template-columns: 268px 1fr; gap: 12px;
    align-items: start;
  }

  /* 좌측 사이드 */
  .gl-side {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    position: sticky; top: 60px;
  }
  .gl-side-label {
    font-size: 10.5px; font-weight: 800; color: var(--z-500);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .gl-side-divisions { display: flex; flex-direction: column; gap: 6px; }
  .gl-div { display: flex; flex-direction: column; gap: 2px; }
  .gl-div-label {
    margin: 6px 0 2px; padding: 0 4px;
    font-size: 10.5px; font-weight: 800; color: var(--z-500);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .gl-team {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; border-radius: 8px;
    background: transparent; border: 1px solid transparent;
    font-family: var(--font); text-align: left; cursor: pointer;
    transition: all .12s;
  }
  .gl-team:hover { background: var(--z-50); }
  .gl-team.on { background: var(--accent-tint); border-color: var(--accent); }
  .gl-team.on .gl-team-name { color: var(--accent); }
  .gl-team-name { flex: 1; font-size: 12.5px; font-weight: 700; color: var(--z-800); }
  .gl-team-meta { display: inline-flex; gap: 4px; }
  .gl-team-pill {
    padding: 1px 6px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 10px; font-weight: 800; font-feature-settings: "tnum";
  }
  .gl-team-pill.warn { background: var(--warning-soft); color: var(--warning); }
  .gl-side-foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
  .gl-add-team {
    width: 100%; padding: 8px;
    border: 1px dashed var(--border-strong); border-radius: 8px;
    background: transparent; color: var(--z-500);
    font-family: var(--font); font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all .12s;
  }
  .gl-add-team:hover { border-color: var(--accent); color: var(--accent); }

  /* 우측 컨텐츠 */
  .gl-main {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .gl-toolbar { display: flex; align-items: center; gap: 12px; }
  .gl-seg {
    display: inline-flex; gap: 2px; padding: 2px;
    background: var(--z-100); border-radius: 8px;
  }
  .gl-seg button {
    height: 30px; padding: 0 14px; border-radius: 6px;
    background: transparent; border: none;
    font-family: var(--font); font-size: 12.5px; font-weight: 700;
    color: var(--z-600); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .gl-seg button.on { background: #FFFFFF; color: var(--z-900); box-shadow: var(--shadow-xs); }
  .gl-seg-cnt {
    padding: 1px 6px; border-radius: 4px;
    background: var(--z-200); color: var(--z-700);
    font-size: 10px; font-weight: 800; font-feature-settings: "tnum";
  }
  .gl-seg button.on .gl-seg-cnt { background: var(--accent-soft); color: var(--accent); }

  .gl-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .gl-chip {
    height: 28px; padding: 0 12px; border-radius: 999px;
    background: #FFFFFF; border: 1px solid var(--border);
    font-family: var(--font); font-size: 12px; font-weight: 700;
    color: var(--z-700); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s;
  }
  .gl-chip:hover { border-color: var(--accent); color: var(--accent); }
  .gl-chip.on { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }
  .gl-chip-cnt {
    padding: 1px 6px; border-radius: 4px;
    background: var(--z-100); color: var(--z-700);
    font-size: 10px; font-weight: 800; font-feature-settings: "tnum";
  }
  .gl-chip.on .gl-chip-cnt { background: var(--accent); color: #FFFFFF; }

  .gl-resource-split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; align-items: start; }
  .gl-resource-list { display: flex; flex-direction: column; gap: 6px; max-height: 600px; overflow-y: auto; padding-right: 4px; }
  .gl-res-row {
    display: flex; flex-direction: column; gap: 4px;
    padding: 12px 14px; border-radius: 8px;
    background: #FAFAFB; border: 1px solid var(--border);
    text-align: left; font-family: var(--font); cursor: pointer;
    transition: all .12s;
  }
  .gl-res-row:hover { background: #FFFFFF; border-color: var(--border-strong); }
  .gl-res-row.on { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .gl-kind {
    padding: 2px 8px; border-radius: 4px;
    font-size: 10.5px; font-weight: 800; letter-spacing: -0.01em;
  }
  .gl-kind.education { background: var(--accent-soft); color: var(--accent); }
  .gl-kind.handover  { background: var(--warning-soft); color: var(--warning); }
  .gl-aud {
    padding: 2px 8px; border-radius: 4px;
    background: var(--z-100); color: var(--z-700);
    font-size: 10.5px; font-weight: 700;
  }
  .gl-attach {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 6px; border-radius: 4px;
    background: var(--z-100); color: var(--z-600);
    font-size: 10.5px; font-weight: 700; font-feature-settings: "tnum";
  }
  .gl-res-title { font-size: 13.5px; font-weight: 800; color: var(--z-900); letter-spacing: -0.015em; }
  .gl-res-desc {
    font-size: 11.5px; font-weight: 500; color: var(--z-600);
    line-height: 1.45;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .gl-res-foot {
    margin-top: 2px; display: flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; color: var(--z-500); font-feature-settings: "tnum";
  }

  .gl-resource-detail {
    padding: 16px; border-radius: 10px;
    background: #FAFAFB; border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }
  .gl-detail-title { font-size: 16px; font-weight: 800; letter-spacing: -0.025em; color: var(--z-900); }
  .gl-detail-foot { font-size: 11.5px; font-weight: 600; color: var(--z-500); font-feature-settings: "tnum"; }
  .gl-detail-desc { font-size: 13px; font-weight: 500; color: var(--z-700); line-height: 1.6; white-space: pre-wrap; }
  .gl-detail-keys { display: flex; gap: 4px; flex-wrap: wrap; }
  .gl-key {
    padding: 2px 8px; border-radius: 999px;
    background: #FFFFFF; border: 1px solid var(--border);
    color: var(--z-600);
    font-size: 11px; font-weight: 700;
    white-space: nowrap;
  }
  .gl-detail-att {
    margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px;
  }
  .gl-detail-att-label { font-size: 11px; font-weight: 800; color: var(--z-600); letter-spacing: 0.04em; text-transform: uppercase; }
  .gl-att-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px;
    background: #FFFFFF; border: 1px solid var(--border);
    font-size: 12px;
  }
  .gl-att-dl {
    height: 26px; padding: 0 12px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid #C7DAFE;
    font-family: var(--font); font-size: 11.5px; font-weight: 800; cursor: pointer;
  }

  /* 할일 */
  .gl-task-quick {
    display: grid; grid-template-columns: 1fr 100px 150px auto; gap: 8px;
    padding: 12px;
    background: var(--accent-soft); border: 1px solid #C7DAFE; border-radius: 10px;
  }
  .gl-task-quick .input { background: #FFFFFF; }
  .gl-task-input { font-weight: 700; }
  .gl-task-list { display: flex; flex-direction: column; gap: 6px; }
  .gl-task-row {
    display: grid; grid-template-columns: 24px 50px 1fr auto 24px; gap: 12px; align-items: center;
    padding: 12px 14px; border-radius: 8px;
    background: #FFFFFF; border: 1px solid var(--border);
    transition: border-color .12s;
  }
  .gl-task-row:hover { border-color: var(--border-strong); }
  .gl-task-row.done { background: var(--z-50); opacity: 0.7; }
