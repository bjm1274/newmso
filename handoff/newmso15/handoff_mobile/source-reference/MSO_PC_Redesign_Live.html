  .gl-task-row.done .gl-task-title { text-decoration: line-through; color: var(--z-500); }
  .gl-task-check {
    width: 22px; height: 22px; border-radius: 6px;
    background: #FFFFFF; border: 1.5px solid var(--border-strong);
    display: grid; place-items: center;
    cursor: pointer; color: #FFFFFF; transition: all .12s;
  }
  .gl-task-check:hover { border-color: var(--accent); }
  .gl-task-check.on { background: var(--success); border-color: var(--success); }
  .gl-task-pri {
    padding: 3px 10px; border-radius: 5px;
    font-size: 10.5px; font-weight: 800; text-align: center;
  }
  .gl-task-pri.tone-danger  { background: var(--danger-soft);  color: var(--danger); }
  .gl-task-pri.tone-warn    { background: var(--warning-soft); color: var(--warning); }
  .gl-task-pri.tone-accent  { background: var(--accent-soft);  color: var(--accent); }
  .gl-task-pri.tone-muted   { background: var(--z-100);        color: var(--z-600); }
  .gl-task-title { font-size: 13.5px; font-weight: 700; color: var(--z-900); letter-spacing: -0.015em; }
  .gl-task-note { margin-top: 2px; font-size: 11.5px; font-weight: 500; color: var(--z-500); }
  .gl-task-meta { display: flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--z-500); font-feature-settings: "tnum"; }
  .gl-task-due { color: var(--z-700); font-weight: 700; }
  .gl-task-author { color: var(--z-500); }
  .gl-task-more {
    width: 24px; height: 24px; border-radius: 6px;
    background: transparent; border: none; color: var(--z-500);
    font-size: 16px; line-height: 1; cursor: pointer;
  }
  .gl-task-more:hover { background: var(--z-100); color: var(--z-900); }

  .gl-empty {
    padding: 32px;
    background: var(--z-50); border: 1px dashed var(--border); border-radius: 8px;
    text-align: center;
    font-size: 13px; font-weight: 600; color: var(--z-500);
  }

  /* ──────── 시스템 마스터 센터 ──────── */
  .mc-eyebrow {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #18181B 0%, #27272A 100%);
    color: #FAFAFA; border-radius: var(--radius-2xl);
    box-shadow: var(--shadow-pop);
  }
  .mc-shield {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(239,68,68,0.15); color: #FCA5A5;
    display: grid; place-items: center;
  }
  .mc-eye-title { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .mc-eye-sub { margin-top: 2px; font-size: 11.5px; font-weight: 500; color: #A1A1AA; }
  .mc-stat-pill {
    height: 28px; padding: 0 12px; border-radius: 999px;
    background: rgba(255,255,255,0.06); color: #E4E4E7;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; font-feature-settings: "tnum";
    border: 1px solid rgba(255,255,255,0.08);
  }
  .mc-stat-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--z-400); }
  .mc-stat-dot.success { background: var(--success); }
  .mc-stat-dot.warn { background: var(--warning); }
  .mc-stat-dot.danger { background: var(--danger); }

  .mc-tabs {
    display: flex; gap: 4px; padding: 4px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    overflow-x: auto;
  }
  .mc-tab {
    height: 34px; padding: 0 14px; border-radius: 6px;
    background: transparent; border: none;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font); font-size: 12.5px; font-weight: 700;
    color: var(--z-600); cursor: pointer; white-space: nowrap;
    transition: all .12s;
  }
  .mc-tab:hover { background: var(--z-50); color: var(--z-900); }
  .mc-tab.on { background: var(--z-900); color: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

  .mc-kpi-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (min-width: 1440px) {
    .mc-kpi-row { grid-template-columns: repeat(8, 1fr); }
  }
  .mc-kpi {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 16px;
    box-shadow: var(--shadow-xs);
    display: flex; flex-direction: column; gap: 4px;
  }
  .mc-kpi.tone-accent { border-color: #C7DAFE; }
  .mc-kpi.tone-warn { background: var(--warning-soft); border-color: #FDE68A; }
  .mc-kpi.tone-danger { background: var(--danger-soft); border-color: #FECACA; }
  .mc-kpi-lbl { font-size: 11.5px; font-weight: 700; color: var(--z-500); }
  .mc-kpi-val {
    font-size: 22px; font-weight: 800; letter-spacing: -0.03em;
    font-feature-settings: "tnum"; line-height: 1.1; color: var(--z-900);
  }
  .mc-kpi-unit { font-size: 12px; font-weight: 700; color: var(--z-500); margin-left: 2px; }
  .mc-kpi-sub { font-size: 10.5px; font-weight: 600; color: var(--z-500); }

  .mc-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mc-card {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .mc-card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mc-card-title { font-size: 14px; font-weight: 800; letter-spacing: -0.02em; color: var(--z-900); }

  .mc-log-list { display: flex; flex-direction: column; gap: 4px; }
  .mc-log-row {
    display: grid; grid-template-columns: 70px 60px 1fr; gap: 12px; align-items: center;
    padding: 8px 10px; border-radius: 6px;
    transition: background .12s;
  }
  .mc-log-row:hover { background: var(--z-50); }
  .mc-log-time { font-size: 11px; font-weight: 700; color: var(--z-500); font-feature-settings: "tnum"; }
  .mc-log-cat {
    padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 800; text-align: center;
  }
  .mc-log-cat.tone-danger  { background: var(--danger-soft);  color: var(--danger); }
  .mc-log-cat.tone-warn    { background: var(--warning-soft); color: var(--warning); }
  .mc-log-cat.tone-success { background: var(--success-soft); color: var(--success); }
  .mc-log-cat.tone-muted   { background: var(--z-100);        color: var(--z-600); }
  .mc-log-main { min-width: 0; }
  .mc-log-action { font-size: 12.5px; font-weight: 700; color: var(--z-900); }
  .mc-log-target { font-size: 11px; font-weight: 500; color: var(--z-500); margin-top: 1px; }

  .mc-history-tbl tbody tr td:first-child { color: var(--z-500); }

  .mc-sensitive { display: flex; flex-direction: column; gap: 10px; }
  .mc-sens-row {
    display: grid; grid-template-columns: 100px 1fr 60px; gap: 10px; align-items: center;
  }
  .mc-sens-lbl { font-size: 12px; font-weight: 700; color: var(--z-700); }
  .mc-sens-bar { height: 8px; background: var(--z-100); border-radius: 999px; overflow: hidden; }
  .mc-sens-bar span { display: block; height: 100%; }
  .mc-sens-val { text-align: right; font-size: 12px; font-weight: 800; color: var(--z-900); font-feature-settings: "tnum"; }
  .mc-sens-foot {
    margin-top: 6px; padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 11px; font-weight: 600; color: var(--z-500);
  }

  .mc-perm-list { display: flex; flex-direction: column; gap: 8px; }
  .mc-perm-row { padding: 12px; border-radius: 8px; background: var(--z-50); border: 1px solid var(--border); }
  .mc-perm-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .mc-perm-tokens { display: flex; flex-wrap: wrap; gap: 4px; }
  .mc-perm-tok {
    padding: 3px 10px; border-radius: 6px;
    background: #FFFFFF; border: 1px solid var(--border);
    font-size: 11px; font-weight: 700; color: var(--z-700);
  }
  .mc-perm-tok.add { background: var(--success-soft); color: var(--success); border-color: #BBF7D0; }
  .mc-perm-tok.rem { background: var(--danger-soft); color: var(--danger); border-color: #FECACA; text-decoration: line-through; }

  .mc-bw-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px;
    background: var(--warning-soft); border: 1px solid #FDE68A; border-radius: var(--radius-lg);
  }
  .mc-bw-bar .mc-stat-pill { background: #FFFFFF; color: var(--warning); border-color: #FDE68A; }
  .mc-bw-chips {
    display: flex; flex-wrap: wrap; gap: 4px;
    max-height: 200px; overflow-y: auto;
    padding: 12px; border-radius: 8px;
    background: var(--z-50); border: 1px solid var(--border);
  }
  .mc-bw-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    background: var(--danger-soft); color: var(--danger);
    font-size: 11.5px; font-weight: 700;
  }
  .mc-bw-chip button {
    background: transparent; border: none; color: inherit;
    font-size: 14px; line-height: 1; cursor: pointer;
    padding: 0; opacity: 0.6;
  }
  .mc-bw-chip button:hover { opacity: 1; }

  .mc-failures { display: flex; flex-direction: column; gap: 6px; }
  .mc-fail {
    display: grid; grid-template-columns: 50px 1fr auto; gap: 14px; align-items: center;
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border);
  }
  .mc-fail.tone-critical { background: var(--danger-soft); border-color: #FECACA; }
  .mc-fail.tone-warning  { background: var(--warning-soft); border-color: #FDE68A; }
  .mc-fail.tone-info     { background: var(--z-50); }
  .mc-fail-sev {
    padding: 3px 8px; border-radius: 4px; text-align: center;
    font-size: 10.5px; font-weight: 800;
  }
  .mc-fail.tone-critical .mc-fail-sev { background: var(--danger); color: #FFFFFF; }
  .mc-fail.tone-warning  .mc-fail-sev { background: var(--warning); color: #FFFFFF; }
  .mc-fail.tone-info     .mc-fail-sev { background: var(--z-300); color: var(--z-800); }
  .mc-fail-label { font-size: 13px; font-weight: 800; color: var(--z-900); letter-spacing: -0.015em; }
  .mc-fail-cnt { font-size: 11px; font-weight: 700; color: var(--z-500); font-feature-settings: "tnum"; }
  .mc-fail-detail { margin-top: 2px; font-size: 11.5px; font-weight: 500; color: var(--z-700); }

  .mc-platforms { display: flex; flex-direction: column; gap: 8px; }
  .mc-platform {
    display: grid; grid-template-columns: 80px 1fr 60px; gap: 10px; align-items: center;
  }
  .mc-plat-lbl { font-size: 12px; font-weight: 800; color: var(--z-700); }
  .mc-plat-bar { height: 10px; background: var(--z-100); border-radius: 999px; overflow: hidden; }
  .mc-plat-bar span { display: block; height: 100%; background: var(--accent); }
  .mc-plat-val { text-align: right; font-size: 12px; font-weight: 800; font-feature-settings: "tnum"; }

  .mc-cron-list { display: flex; flex-direction: column; gap: 6px; }
  .mc-cron-row {
    display: grid; grid-template-columns: 1fr 100px 60px; gap: 12px; align-items: center;
    padding: 8px 10px; border-radius: 6px; background: var(--z-50);
  }

  .mc-recovery-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 18px;
    background: var(--danger-soft); border: 1px solid #FECACA;
    border-radius: var(--radius-lg);
  }

  .mc-restore-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px; border-radius: 6px;
    background: var(--z-50); border: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .mc-empty-hint {
    margin-top: 8px; padding: 12px;
    background: var(--success-soft); border-radius: 6px;
    color: var(--success); font-size: 11.5px; font-weight: 700; text-align: center;
  }

  .mc-leave-form {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs); padding: 18px;
  }
  .mc-leave-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-top: 12px;
  }
  .mc-leave-field { display: flex; flex-direction: column; gap: 4px; }
  .mc-leave-field > span { font-size: 11px; font-weight: 800; color: var(--z-600); letter-spacing: 0.03em; text-transform: uppercase; }

  .mc-history-tbl td { font-size: 12.5px; }
  .small.tnum { font-feature-settings: "tnum"; }
  .tnum { font-feature-settings: "tnum"; }

  /* ──────── 분석 ──────── */
  .anal-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .anal-kpi {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 18px 20px; box-shadow: var(--shadow-xs);
    display: flex; flex-direction: column; gap: 8px;
  }
  .anal-kpi-top { display: flex; align-items: center; justify-content: space-between; }
  .anal-kpi-lbl { font-size: 12px; font-weight: 700; color: var(--z-500); }
  .anal-kpi-val { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; font-feature-settings:"tnum"; line-height: 1.0; }
  .anal-kpi-spark { margin-top: 4px; }

  .anal-chart { margin-top: 14px; }
  .anal-bars {
    display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px;
    align-items: end; height: 140px; padding-bottom: 4px;
  }
  .anal-bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 4px; }
  .anal-x {
    display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px;
    margin-top: 8px; font-size: 11px; font-weight: 700; color: var(--z-500); text-align: center;
    font-feature-settings:"tnum";
  }
  .anal-dept-list { display: grid; gap: 10px; margin-top: 10px; }
  .anal-dept-row {
    display: grid; grid-template-columns: 100px 1fr 80px;
    gap: 12px; align-items: center;
  }
  .anal-dept-name { font-size: 13px; font-weight: 700; color: var(--z-700); }
  .anal-dept-bar { height: 10px; background: var(--z-100); border-radius: 999px; overflow: hidden; }
  .anal-dept-fill { height: 100%; }
  .anal-dept-val { text-align: right; font-size: 13px; font-weight: 800; font-feature-settings:"tnum"; }

  /* simple KPI row (원본 5장 단순 카드) */
  .kpi-simple-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .kpi-simple {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow-xs);
    display: grid;
    grid-template-columns: 36px 1fr auto;
    align-items: center;
    column-gap: 12px;
    min-height: 76px;
    cursor: pointer;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .kpi-simple:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.04); }
  .kpi-simple:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .kpi-simple .kpi-ico { width: 36px; height: 36px; border-radius: 10px; }
  .kpi-simple .kpi-info { min-width: 0; }
  .kpi-simple .kpi-lbl {
    font-size: 13px; font-weight: 800; color: var(--z-900);
    letter-spacing: -0.015em; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
  }
  .kpi-simple .kpi-sub {
    margin-top: 2px;
    font-size: 11px; font-weight: 600; color: var(--z-500); white-space: nowrap;
  }
  .kpi-simple .kpi-right { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .kpi-simple-val {
    font-size: 24px; font-weight: 800; letter-spacing: -0.025em;
    font-feature-settings: "tnum"; color: var(--z-900); line-height: 1.0;
  }
  .kpi-frac { font-size: 14px; font-weight: 700; color: var(--z-400); letter-spacing: -0.02em; }
  .kpi-unit2 { font-size: 13px; font-weight: 700; color: var(--z-500); margin-left: 2px; letter-spacing: -0.01em; }
  .kpi-link {
    height: 30px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--accent-soft); color: var(--accent);
    font-family: var(--font); font-size: 12px; font-weight: 800; cursor: pointer;
  }
  .kpi-link:hover { background: #DCE7FF; }

  html[data-mode="before"] .kpi-simple { padding: 12px 14px; border-radius: 8px; min-height: 60px; }
  html[data-mode="before"] .kpi-simple .kpi-ico { display: none; }
  html[data-mode="before"] .kpi-simple { grid-template-columns: 1fr auto; column-gap: 8px; }
  html[data-mode="before"] .kpi-simple-val { font-size: 20px; }
  html[data-mode="before"] .kpi-simple .kpi-lbl { font-size: 12px; font-weight: 700; }
  html[data-mode="before"] .kpi-simple .kpi-sub { font-size: 10px; }

  /* kpi (rich version — keep for other screens) */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: var(--card-pad);
    box-shadow: var(--shadow-xs);
    display: flex; flex-direction: column; gap: 8px;
  }
  .kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .kpi-ico {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
  }
  .kpi-ico.warn { background: var(--warning-soft); color: var(--warning); }
  .kpi-ico.success { background: var(--success-soft); color: var(--success); }
  .kpi-ico.danger { background: var(--danger-soft); color: var(--danger); }
  .kpi-lbl { font-size: var(--caption-fs); color: var(--z-500); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .kpi-val { font-size: var(--kpi-num-fs); font-weight: 800; letter-spacing: -0.03em; line-height: 1.0; font-feature-settings: "tnum"; white-space: nowrap; }
  .kpi-unit { font-size: 13px; font-weight: 700; color: var(--z-500); margin-left: 2px; }
  .kpi-foot { display: flex; align-items: center; justify-content: space-between; font-size: var(--caption-fs); color: var(--z-500); white-space: nowrap; }
  .kpi-delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
  .kpi-delta.up { color: var(--success); }
  .kpi-delta.dn { color: var(--danger); }
  /* before mode KPI looks plainer */
  html[data-mode="before"] .kpi-ico { display: none; }
  html[data-mode="before"] .kpi-foot { display: none; }
  html[data-mode="before"] .kpi-spark { display: none; }

  /* spark line */
  .kpi-spark { height: 28px; margin: 4px -4px -4px; }

  /* profile card */
  .profile {
    display: flex; align-items: center; gap: 18px;
  }
  .pfp { width: 64px; height: 64px; border-radius: 999px; background: var(--z-200); object-fit: cover; flex-shrink: 0; }
  .pname { font-size: 20px; font-weight: 800; letter-spacing: -0.025em; white-space: nowrap; }
  html[data-mode="before"] .pname { font-size: 17px; font-weight: 700; }
  .prole { font-size: var(--caption-fs); color: var(--z-500); font-weight: 600; margin-top: 2px; }
  .pchips { display: flex; gap: 6px; margin-top: 8px; }

  /* notes panel — 각 메뉴 화면 하단에 개선 포인트를 시각적으로 부착 */
  .notes {
    background: #0B0B0E; color: #E4E4E7;
    border-radius: var(--radius-2xl);
    padding: 22px 24px;
    width: 1440px; max-width: 100%;
    display: grid; grid-template-columns: 220px 1fr; gap: 24px;
  }
  .notes h3 {
    font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--accent);
    text-transform: uppercase;
  }
  .notes h2 {
    margin-top: 6px;
    font-size: 18px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3;
    color: #fff;
  }
  .notes .nbody { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .notes .pt {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 14px 16px;
  }
  .notes .pt .num { font-family: var(--mono); font-size: 11px; font-weight: 800; color: var(--accent); }
  .notes .pt h4 { margin-top: 6px; font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -0.015em; }
  .notes .pt p { margin-top: 6px; font-size: 12px; color: #A1A1AA; line-height: 1.55; }

  /* misc */
  .row { display: flex; align-items: center; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  /* search input */
  .input {
    height: var(--btn-h); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 0 12px; font-family: var(--font); font-size: 13px; min-width: 220px;
    color: var(--z-900); background: #fff;
  }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .input-wrap { position: relative; }
  .input-wrap .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--z-400); }
  .input-wrap .input { padding-left: 32px; }
  .kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--z-500);
    padding: 2px 6px; background: var(--z-100); border-radius: 4px;
  }

  /* favorite chip row */
  .fav-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .fav-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 12px; border-radius: 999px;
    background: #FFF; border: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: var(--z-700); cursor: pointer;
    white-space: nowrap;
  }
  .fav-chip:hover { background: var(--z-50); border-color: var(--border-strong); }
  .fav-chip.add { color: var(--z-500); border-style: dashed; }

  /* hierarchy demo helpers */
  .small { font-size: var(--caption-fs); color: var(--z-500); }
  .strong { font-weight: 800; }

  /* timeline list (할일/알림 등) */
  .tl-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .tl-item:last-child { border-bottom: 0; }
  .tl-dot { width: 8px; height: 8px; border-radius: 999px; margin-top: 8px; background: var(--accent); flex-shrink: 0; }
  .tl-dot.warn { background: var(--warning); }
  .tl-dot.muted { background: var(--z-300); }
  .tl-body { flex: 1; }
  .tl-title { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; word-break: keep-all; }
  .tl-meta { font-size: 11px; color: var(--z-500); margin-top: 2px; }

  /* command palette mock */
  .cmdk-back {
    position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: grid; place-items: start center; padding-top: 80px;
    backdrop-filter: blur(4px);
  }
  .cmdk {
    width: 560px; background: #fff; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .cmdk-input {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .cmdk-input input {
    flex: 1; border: 0; outline: 0; font-family: var(--font); font-size: 15px; font-weight: 500;
  }
  .cmdk-list { padding: 6px; max-height: 320px; overflow: auto; }
  .cmdk-group { padding: 6px 12px; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; color: var(--z-400); text-transform: uppercase; }
  .cmdk-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
  }
  .cmdk-item.on { background: var(--accent-soft); color: var(--accent); }
  .cmdk-item .ititle { font-size: 13px; font-weight: 600; flex: 1; }
  .cmdk-item .ipath { font-size: 11px; color: var(--z-400); font-weight: 600; }
  .cmdk-item.on .ipath { color: var(--accent); }

  /* ─────────────────────────────── 채팅 (Chat) ─────────────────────────────── */
  /* 메뉴 공통 pageheader — addon은 제목 숨김, 이건 제목 보임 */
  .mod-pageheader {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: 4px 0; flex-wrap: wrap;
  }
  .mod-pageheader > div:first-child { display: block; min-width: 0; flex: 0 1 auto; }
  /* 제목·서브 라인 숨김 — 채팅은 chat-h-name/sub 사용으로 영향 없음 */
  .mod-pageheader .addon-h1,
  .mod-pageheader .addon-sub { display: none; }

  .chat-side { padding: 10px 8px; gap: 6px; }
  .chat-side-head { display: flex; gap: 6px; align-items: center; padding: 0 4px 8px; border-bottom: 1px solid var(--border); }
  .chat-tabs { display: inline-flex; gap: 2px; padding: 2px; background: var(--z-100); border-radius: 8px; flex-shrink: 0; }
  .chat-tabs button {
    height: 26px; padding: 0 10px; border: 0; background: transparent; cursor: pointer;
    font-family: var(--font); font-size: 11px; font-weight: 800; color: var(--z-600); border-radius: 6px; white-space: nowrap;
  }
  .chat-tabs button.on { background: #fff; color: var(--z-900); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .chat-side-scroll { display: flex; flex-direction: column; gap: 2px; padding: 6px 0; overflow: auto; flex: 1; }
  .chat-side-lbl { margin: 6px 6px 2px; font-size: 10px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; }
  .chat-side-add {
    margin: 6px 4px 4px; padding: 8px; border-radius: 8px;
    background: transparent; border: 1px dashed var(--border-strong);
    color: var(--z-500); cursor: pointer;
    font-family: var(--font); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .chat-side-add:hover { color: var(--accent); border-color: var(--accent); }
  .chat-room {
    position: relative; display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center;
    padding: 8px 6px; border-radius: 8px; cursor: pointer; min-width: 0;
  }
  .chat-room:hover { background: var(--z-50); }
  .chat-room.on { background: var(--accent-tint); }
  .chat-room.on .chat-room-name { color: var(--accent); }
  .chat-room-pic {
    position: relative; width: 30px; height: 30px; border-radius: 999px;
    display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff;
    flex-shrink: 0;
  }
  .chat-room-pic.lg { width: 36px; height: 36px; font-size: 14px; border-radius: 10px; }
  .chat-room-pic.tone-accent { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
  .chat-room-pic.tone-blue   { background: linear-gradient(135deg, #3B82F6, #2563EB); }
  .chat-room-pic.tone-amber  { background: linear-gradient(135deg, #F59E0B, #D97706); }
  .chat-room-pic.tone-green  { background: linear-gradient(135deg, #10B981, #059669); }
  .chat-room-pic.tone-cyan   { background: linear-gradient(135deg, #06B6D4, #0891B2); }
  .chat-room-pic.tone-violet { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
  .chat-room-pic.tone-pink   { background: linear-gradient(135deg, #EC4899, #DB2777); }
  .chat-room-pic.tone-gray   { background: linear-gradient(135deg, #94A3B8, #64748B); }
  .chat-room-dot {
    position: absolute; bottom: -1px; right: -1px; width: 8px; height: 8px;
    border-radius: 999px; border: 2px solid #fff;
  }
  .chat-room-dot.on  { background: var(--success); }
  .chat-room-dot.off { background: #FBBF24; }
  .chat-room-body { min-width: 0; }
  .chat-room-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .chat-room-name { font-size: 12px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .chat-room-cnt  { font-size: 10px; font-weight: 700; color: var(--z-500); flex-shrink: 0; }
  .chat-room-at   { font-size: 10px; font-weight: 700; color: var(--z-400); flex-shrink: 0; font-feature-settings:"tnum"; }
  .chat-room-last { font-size: 11px; color: var(--z-500); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-room-badge {
    min-width: 18px; height: 18px; border-radius: 999px;
    background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 800; padding: 0 5px;
    display: grid; place-items: center; font-feature-settings:"tnum";
  }
  .chat-room.compact { padding: 6px; grid-template-columns: 26px 1fr auto; }
  .chat-room.compact .chat-room-pic { width: 26px; height: 26px; font-size: 11px; }
  .chat-room.compact .chat-room-name { font-size: 11px; }
  .chat-room.compact .chat-room-last { font-size: 10px; }

  /* 채팅 헤더 */
  .chat-pageheader { padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 0 !important; }
  .chat-h-name { font-size: 16px; font-weight: 800; letter-spacing: -0.025em; display: flex; align-items: baseline; gap: 8px; }
  .chat-h-cnt  { font-size: 12px; font-weight: 700; color: var(--z-500); }
  .chat-h-sub  { margin-top: 2px; font-size: 11px; color: var(--z-500); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .chat-h-dot  { width: 6px; height: 6px; border-radius: 999px; background: var(--success); }
  .btn.on-toggle { background: var(--accent); color: #fff; border-color: transparent; }

  /* 채팅 shell — main 영역 안에 thread + drawer */
  .chat-shell {
    display: grid; grid-template-columns: 1fr; gap: 12px;
    margin-top: 12px;
  }
  .chat-shell.with-drawer { grid-template-columns: 1fr 260px; }
  .chat-thread {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    overflow: hidden; min-height: 440px; max-height: 540px;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-xs);
  }
  .chat-jump-bar { padding: 10px 16px; background: var(--z-50); border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .chat-msgs { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

  /* 채팅 A안 — Slack/Linear형 */
  .chat-line {
    position: relative; display: grid; grid-template-columns: 32px 1fr auto; gap: 10px;
    padding: 4px 6px; border-radius: 6px;
  }
  .chat-line:hover { background: var(--z-50); }
  .chat-line-pic {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center; color: #fff;
    font-size: 12px; font-weight: 800; flex-shrink: 0;
  }
  .chat-line-pic.tone-blue   { background: linear-gradient(135deg, #3B82F6, #2563EB); }
  .chat-line-pic.tone-pink   { background: linear-gradient(135deg, #EC4899, #DB2777); }
  .chat-line-pic.tone-violet { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
  .chat-line-pic.tone-gray   { background: linear-gradient(135deg, #94A3B8, #64748B); }
  .chat-line-head { display: flex; align-items: baseline; gap: 6px; }
  .chat-line-head b { font-size: 13px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900); }
  .chat-line-head span { font-size: 10px; font-weight: 700; color: var(--z-400); font-feature-settings:"tnum"; }
  .chat-line-text { font-size: 13px; color: var(--z-800); margin-top: 2px; line-height: 1.55; word-break: keep-all; }
  .chat-line-actions { display: none; align-items: center; gap: 2px; }
  .chat-line:hover .chat-line-actions { display: flex; }
  .chat-line-actions button {
    width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; cursor: pointer; color: var(--z-500);
    display: grid; place-items: center; font-size: 11px;
  }
  .chat-line-actions button:hover { color: var(--accent); border-color: var(--accent); }

  /* 채팅 B안 — KakaoWork형 (좌우 버블) */
  .chat-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-row.mine { justify-content: flex-end; }
  .chat-row.other { justify-content: flex-start; }
  .chat-bub-pic {
    width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center; color: #fff;
    font-size: 11px; font-weight: 800; flex-shrink: 0;
  }
  .chat-bub-pic.tone-blue   { background: linear-gradient(135deg, #3B82F6, #2563EB); }
  .chat-bub-pic.tone-pink   { background: linear-gradient(135deg, #EC4899, #DB2777); }
  .chat-bub-pic.tone-violet { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
  .chat-bub-pic.tone-gray   { background: linear-gradient(135deg, #94A3B8, #64748B); }
  .chat-bub-col { display: flex; flex-direction: column; max-width: 70%; }
  .chat-bub-name { font-size: 11px; font-weight: 700; color: var(--z-700); margin-bottom: 2px; padding: 0 4px; }
  .chat-bub-grp { display: flex; align-items: flex-end; gap: 6px; }
  .chat-bub {
    padding: 8px 12px; border-radius: 14px;
    font-size: 13px; line-height: 1.55; word-break: keep-all;
  }
  .chat-bub.mine  { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .chat-bub.other { background: #fff; color: var(--z-900); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .chat-bub-ts { font-size: 10px; font-weight: 700; color: var(--z-400); white-space: nowrap; flex-shrink: 0; font-feature-settings:"tnum"; }
  .chat-bub-body { font-weight: 500; }
  .chat-row.mine .chat-bub-col { align-items: flex-end; }

  /* 시스템 메시지 */
  .chat-system {
    align-self: center; padding: 4px 12px; border-radius: 999px;
    background: var(--z-100); color: var(--z-500);
    font-size: 11px; font-weight: 700;
  }

  /* 리액션 */
  .chat-react { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .chat-react-chip {
    height: 22px; padding: 0 8px; border-radius: 999px;
    background: var(--accent-tint); color: var(--accent);
    font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .chat-react-add {
    height: 22px; width: 22px; border-radius: 999px;
    background: var(--z-100); color: var(--z-500); border: 0; cursor: pointer;
    font-size: 12px; font-weight: 700;
  }

  /* 드로어 */
  .chat-drawer {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    overflow: hidden; max-height: 540px; display: flex; flex-direction: column;
    box-shadow: var(--shadow-xs);
  }
  .chat-drawer-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .chat-drawer-head .x { background: transparent; border: 0; cursor: pointer; color: var(--z-500); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; }
  .chat-drawer-head .x:hover { background: var(--z-100); }
  .chat-drawer-body { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 16px; }
  .chat-drawer-sec { display: flex; flex-direction: column; gap: 8px; }
  .chat-drawer-sec .lbl { font-size: 10px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; }
  .chat-drawer-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--z-700); }
  .chat-mem-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .chat-mem {
    width: 100%; aspect-ratio: 1; border-radius: 8px; color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 800;
  }
  .chat-mem.tone-blue   { background: linear-gradient(135deg, #3B82F6, #2563EB); }
  .chat-mem.tone-pink   { background: linear-gradient(135deg, #EC4899, #DB2777); }
  .chat-mem.tone-violet { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
  .chat-mem.tone-green  { background: linear-gradient(135deg, #10B981, #059669); }
  .chat-mem.tone-gray   { background: var(--z-200); color: var(--z-500); }
  .chat-pin { padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; font-size: 12px; color: var(--accent); font-weight: 600; line-height: 1.45; }
  .chat-media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .chat-media { aspect-ratio: 1; border-radius: 6px; }
  .chat-media-all { background: transparent; border: 0; color: var(--accent); cursor: pointer; font-family: var(--font); font-size: 11px; font-weight: 700; padding: 6px 0; text-align: left; }

  /* 컴포저 */
  .chat-composer {
    margin-top: 12px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 10px 12px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    box-shadow: var(--shadow-xs);
  }
  .chat-comp-actions { display: flex; gap: 4px; }
  .chat-comp-actions button {
    width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer;
    border-radius: 6px; color: var(--z-500); font-size: 14px;
    display: grid; place-items: center;
  }
  .chat-comp-actions button:hover { background: var(--z-100); color: var(--z-900); }
  .chat-comp-input textarea {
    width: 100%; resize: none; border: 0; outline: 0;
    font-family: var(--font); font-size: 13px; line-height: 1.5;
    color: var(--z-900); background: transparent;
  }
  .chat-comp-input textarea::placeholder { color: var(--z-400); }
  .chat-comp-send {
    width: 36px; height: 36px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
    display: grid; place-items: center;
  }
  .chat-comp-send:hover { background: var(--accent-700); }

  /* ─────────────────────────────── 게시판 (Board) ─────────────────────────────── */
  .s2-item.board-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12.5px; font-weight: 700; }
  .board-cnt {
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: var(--z-100); color: var(--z-600);
    font-size: 10px; font-weight: 800;
    display: grid; place-items: center;
  }
  .board-cnt.warn { background: var(--warning-soft); color: var(--warning); }
  .s2-item.board-item.on .board-cnt { background: rgba(255,255,255,0.4); color: #fff; }

  .board-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; flex-wrap: wrap; gap: 10px;
  }
  .board-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .board-tag {
    height: 28px; padding: 0 12px; border-radius: 999px;
    background: #FFF; border: 1px solid var(--border);
    font-family: var(--font); font-size: 11.5px; font-weight: 700; color: var(--z-700);
    cursor: pointer; white-space: nowrap;
  }
  .board-tag.on { background: var(--accent); color: #fff; border-color: transparent; }
  .board-tag:hover:not(.on) { background: var(--z-50); }
  .board-sort {
    height: 28px; padding: 0 8px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff;
    font-family: var(--font); font-size: 11px; font-weight: 700; color: var(--z-700);
  }

  /* 게시판 A — 표 */
  .board-tbl tr.board-tr td { padding: 12px 14px; vertical-align: top; }
  .board-tbl .board-num { font-feature-settings:"tnum"; font-size: 11px; font-weight: 800; color: var(--z-500); }
  .board-tbl .board-title { font-size: 13.5px; font-weight: 700; color: var(--z-900); letter-spacing: -0.01em; cursor: pointer; }
  .board-tbl .board-title:hover { color: var(--accent); }
  .board-tbl .board-cm { font-size: 10px; color: var(--accent); font-weight: 800; }
  .board-tbl .board-star { background: transparent; border: 0; cursor: pointer; padding: 0; display: grid; place-items: center; }
  .board-tbl .board-more { background: transparent; border: 0; cursor: pointer; padding: 4px; color: var(--z-400); border-radius: 6px; }
  .board-tbl .board-more:hover { background: var(--z-100); color: var(--z-900); }
  .board-more-wrap { position: relative; display: inline-block; }
  .board-more-menu {
    position: absolute; right: 0; top: calc(100% + 6px);
    z-index: 50;
    min-width: 180px; padding: 4px;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column; gap: 1px;
  }
  .board-more-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 7px 10px; border-radius: 6px;
    background: transparent; border: none;
    font-family: var(--font); font-size: 12.5px; font-weight: 600; color: var(--z-800);
    text-align: left; cursor: pointer; white-space: nowrap;
    transition: background .12s;
  }
  .board-more-item:hover { background: var(--z-50); }
  .board-more-item.danger { color: var(--danger); }
  .board-more-item.danger:hover { background: var(--danger-soft); }
  .board-more-sep { height: 1px; background: var(--border); margin: 2px 0; }
  .board-tags-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .board-tag-mini {
    font-size: 10px; font-weight: 700; color: var(--z-500);
    padding: 2px 6px; background: var(--z-100); border-radius: 4px;
  }
  .tnum { font-feature-settings: "tnum"; }

  /* 게시판 B — 카드 */
  .board-card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .board-card {
    position: relative;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-xs);
    transition: all .15s;
    cursor: pointer;
  }
  .board-card:hover { border-color: var(--accent); box-shadow: var(--shadow-pop); transform: translateY(-1px); }
  .board-card-badge { position: absolute; top: 16px; right: 16px; }
  .board-card-cat { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--z-500); margin-bottom: 8px; }
  .board-card-title {
    font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: var(--z-900);
    line-height: 1.4; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .board-card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
  .board-card-foot {
    padding-top: 12px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .board-card-stats { display: flex; align-items: center; gap: 8px; }

  /* ─────────────────────────────── 전자결재 (Approval) ─────────────────────────────── */
  .ap-stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .ap-stat {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 18px;
    display: flex; flex-direction: column; gap: 4px;
    box-shadow: var(--shadow-xs);
  }
  .ap-stat.tone-warn    { border-left: 3px solid var(--warning); }
  .ap-stat.tone-success { border-left: 3px solid var(--success); }
  .ap-stat.tone-danger  { border-left: 3px solid var(--danger); }
  .ap-stat.tone-accent  { border-left: 3px solid var(--accent); }

  /* A안 — 인박스 split */
  .ap-split { display: grid; grid-template-columns: 380px 1fr; gap: 12px; }
  .ap-list { background: #FFF; border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-xs); }
  .ap-list-head { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--z-50); }
  .ap-list-body { padding: 6px; display: grid; gap: 4px; max-height: 600px; overflow: auto; }
  .ap-row {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: #FFF;
  }
  .ap-row:hover { background: var(--z-50); border-color: var(--border-strong); }
  .ap-row.on { background: var(--accent-soft); border-color: var(--accent); }
  .ap-row-top { display: flex; align-items: center; gap: 6px; }
  .ap-row-type { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 0.02em; }
  .ap-row-date { margin-left: auto; font-size: 10px; color: var(--z-500); font-feature-settings:"tnum"; }
  .ap-row-title { margin-top: 6px; font-size: 13px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.4; color: var(--z-900); }
  .ap-row.on .ap-row-title { color: var(--accent); }
  .ap-row-meta { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 11px; color: var(--z-600); }
  .ap-stage {
    margin-left: auto; font-size: 10px; font-weight: 800;
    padding: 2px 6px; border-radius: 4px;
    background: var(--z-100); color: var(--z-700); font-feature-settings:"tnum";
  }

  /* 상세 */
  .ap-detail { display: grid; gap: 12px; align-content: start; }
  .ap-detail-title { font-size: 18px; font-weight: 800; letter-spacing: -0.025em; margin-top: 8px; }
  .ap-detail-meta {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-top: 14px; padding: 14px; background: var(--z-50); border-radius: 8px;
  }
  .ap-detail-meta > div { display: flex; flex-direction: column; gap: 2px; }
  .ap-detail-meta .lbl { font-size: 10px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; }
  .ap-detail-meta span:not(.lbl) { font-size: 13px; font-weight: 700; color: var(--z-900); }

  /* 결재선 시각화 */
  .ap-line { margin-top: 12px; padding: 12px; background: var(--z-50); border-radius: 8px; }
  .ap-line-lbl { font-size: 11px; font-weight: 800; color: var(--z-600); letter-spacing: 0.04em; margin-bottom: 10px; }
  .ap-line-row { display: flex; align-items: stretch; gap: 0; flex-wrap: nowrap; }
  .ap-line-step { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 78px; flex: 0 0 auto; padding: 6px 8px; border-radius: 8px; background: #fff; border: 1px solid var(--border); }
  .ap-line.compose .ap-line-step { min-width: 90px; padding: 6px 8px; }
  .ap-line.compose { padding: 10px 12px; }
  .ap-line.compose .ap-line-lbl { margin-bottom: 8px; }
  .ap-line-step.done { border-color: var(--success); background: var(--success-soft); }
  .ap-line-step.on { border-color: var(--warning); background: var(--warning-soft); }
  .ap-line-step.me { border-color: var(--accent); background: var(--accent-soft); }
  .ap-line-step.rejected { border-color: var(--danger); background: var(--danger-soft); }
  .ap-line-step.pending  { border-color: var(--border); background: #fff; opacity: 0.7; }
  .ap-line-pic {
    width: 30px; height: 30px; border-radius: 999px;
    background: linear-gradient(135deg, #94A3B8, #64748B); color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 800;
  }
  .ap-line-step.done .ap-line-pic { background: linear-gradient(135deg, #10B981, #059669); }
  .ap-line-step.on .ap-line-pic { background: linear-gradient(135deg, #F59E0B, #D97706); }
  .ap-line-step.me .ap-line-pic { background: linear-gradient(135deg, #3B82F6, #2563EB); }
  .ap-line-step.rejected .ap-line-pic { background: linear-gradient(135deg, #EF4444, #DC2626); }
  .ap-line-step.pending .ap-line-pic  { background: linear-gradient(135deg, #D4D4D8, #A1A1AA); }
  .ap-line-name { font-size: 11.5px; font-weight: 800; color: var(--z-900); }
  .ap-line-role { font-size: 10px; font-weight: 700; color: var(--z-500); }
  .ap-line-sig { font-size: 9px; font-weight: 800; color: var(--success); margin-top: 2px; }
  .ap-line-sig.waiting { color: var(--warning); }

  /* 시각 + 액션 라벨 */
  .ap-line-when {
    margin-top: 2px; padding: 2px 6px; border-radius: 5px;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    font-feature-settings: "tnum";
    min-width: 56px;
  }
  .ap-line-when-act { font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.25; }
  .ap-line-when-ts  { font-size: 9px; font-weight: 700; opacity: 0.85; line-height: 1.1; }
  .ap-line-when.success { background: rgba(16,185,129,0.12); color: var(--success); }
  .ap-line-when.accent  { background: rgba(37,99,235,0.12);  color: var(--accent); }
  .ap-line-when.danger  { background: rgba(239,68,68,0.12);  color: var(--danger); }
  .ap-line-when.waiting { background: rgba(245,158,11,0.12); color: var(--warning); }
  .ap-line-when.muted   { background: var(--z-100); color: var(--z-500); }

  /* 반려 사유 */
  .ap-line-reject {
    margin-left: 10px; padding: 2px 8px; border-radius: 4px;
    background: var(--danger-soft); color: var(--danger);
    font-size: 11px; font-weight: 800;
  }

  /* 작성 흐름 — dense 간격 */
  .ap-line.compose .ap-line-step { min-width: 90px; padding: 6px 8px; }
  .ap-line.compose { padding: 10px 12px; }
  .ap-line.compose .ap-line-lbl { margin-bottom: 8px; }

  /* 작성 흐름 컨텍스트 카드 컴팩트화 */
  .ap-compose .card .card-row { margin-bottom: 8px; }
  .ap-line-bar { flex: 0 1 32px; height: 2px; background: var(--z-200); margin: 0; align-self: center; min-width: 16px; }
  .ap-line-bar.done { background: var(--success); }
  .ap-line-add {
    width: 30px; height: 30px; border-radius: 999px;
    border: 1.5px dashed var(--border-strong); background: #fff;
    color: var(--z-500); cursor: pointer; align-self: center; margin-left: 8px;
    display: grid; place-items: center;
  }
  .ap-line-add:hover { color: var(--accent); border-color: var(--accent); }

  /* 본문 */
  .ap-content { margin-top: 16px; }
  .ap-content-lbl { font-size: 11px; font-weight: 800; color: var(--z-600); letter-spacing: 0.04em; margin-bottom: 8px; }
  .ap-content-body {
    padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; line-height: 1.65; color: var(--z-800);
    white-space: pre-wrap; word-break: keep-all;
  }
  .ap-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

  /* B안 — 워크플로 보드 */
  .ap-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .ap-col {
    background: var(--z-50); border-radius: var(--radius-lg);
    display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border);
    min-height: 360px;
  }
  .ap-col-head {
    padding: 10px 12px; display: flex; align-items: center; justify-content: space-between;
    color: #fff;
  }
  .ap-col-head.tone-gray    { background: #94A3B8; }
  .ap-col-head.tone-warn    { background: var(--warning); }
  .ap-col-head.tone-accent  { background: var(--accent); }
  .ap-col-head.tone-success { background: var(--success); }
  .ap-col-head.tone-danger  { background: var(--danger); }
  .ap-col-name { font-size: 12px; font-weight: 800; letter-spacing: -0.01em; }
  .ap-col-cnt {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
    background: rgba(255,255,255,0.25); color: #fff;
    font-size: 10px; font-weight: 800;
    display: grid; place-items: center;
  }
  .ap-col-body { padding: 8px; display: grid; gap: 8px; }
  .ap-col-empty { padding: 20px 10px; text-align: center; font-size: 11px; color: var(--z-400); font-weight: 600; }
  .ap-board-card {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; cursor: pointer;
    box-shadow: var(--shadow-xs);
    display: flex; flex-direction: column; gap: 6px;
  }
  .ap-board-card:hover { border-color: var(--accent); box-shadow: var(--shadow-pop); }
  .ap-board-title { font-size: 12px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900); line-height: 1.4; }
  .ap-board-stages { display: flex; gap: 3px; margin-top: 4px; }
  .ap-board-stage {
    width: 14px; height: 14px; border-radius: 999px;
    display: grid; place-items: center;
    background: var(--z-100); color: var(--z-500);
    font-size: 8px; font-weight: 800;
  }
  .ap-board-stage.done { background: var(--success); color: #fff; }
  .ap-board-stage.on { background: var(--warning); color: #fff; }
  .ap-board-date { margin-top: 2px; }

  /* 작성하기 */
  .ap-compose { display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px; align-items: start; }
  .ap-compose.single { grid-template-columns: 1fr; }
  .ap-compose-right { display: grid; gap: 12px; }

  /* 헤더 드롭다운 양식 선택 */
  .ap-tpl-pick {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 8px 6px 14px; border-radius: 10px;
    background: #fff; border: 1px solid var(--border);
    box-shadow: var(--shadow-xs);
  }
  .ap-tpl-pick .lbl {
    font-size: 10px; font-weight: 800; color: var(--z-500);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .ap-tpl-pick select {
    height: 32px; padding: 0 10px; border: 0; background: transparent;
    font-family: var(--font); font-size: 15px; font-weight: 800; color: var(--z-900);
    letter-spacing: -0.02em; cursor: pointer; min-width: 200px;
  }
  .ap-tpl-pick select:focus { outline: none; }
  .ap-tpl-pick:hover { border-color: var(--accent); }
  .ap-tpl-group { margin-top: 10px; }
  .ap-tpl-lbl { font-size: 11px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
  .ap-tpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ap-tpl-card {
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--z-50); cursor: pointer; transition: all .15s;
  }
  .ap-tpl-card:hover { background: #fff; border-color: var(--accent); }
  .ap-tpl-card.on { background: var(--accent-soft); border-color: var(--accent); }
  .ap-tpl-name { font-size: 13px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900); margin-bottom: 6px; }
  .ap-tpl-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .ap-form { display: grid; gap: 14px; }
  .ap-form label { display: flex; flex-direction: column; gap: 6px; }
  .ap-form .lbl { font-size: 11px; font-weight: 800; color: var(--z-700); }

  .ap-refs { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ap-refs .lbl { font-size: 11px; font-weight: 800; color: var(--z-600); margin-bottom: 0; flex-shrink: 0; }
  .ap-ref-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 6px 4px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 11px; font-weight: 700;
  }
  .ap-ref-chip button { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 0 4px; font-size: 13px; }
  .ap-ref-add {
    height: 24px; padding: 0 10px; border-radius: 999px;
    background: transparent; border: 1px dashed var(--border-strong); cursor: pointer;
    color: var(--z-500);
    font-family: var(--font); font-size: 11px; font-weight: 700;
  }
  .ap-ref-add:hover { color: var(--accent); border-color: var(--accent); }

  /* ─────────────────────────────── 물품신청 양식 ─────────────────────────────── */
  .supplies-card { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .sup-recent { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); }
  .sup-action {
    height: 30px; padding: 0 12px; border-radius: 999px;
    background: #FFF; border: 1px solid var(--border);
    font-family: var(--font); font-size: 11.5px; font-weight: 700; color: var(--z-700);
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .sup-action:hover { border-color: var(--accent); color: var(--accent); }
  .sup-action.on { background: var(--accent); color: #fff; border-color: transparent; }

  /* 컨텍스트 바 */
  .sup-ctx {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent-soft), #F3F8FF);
    border: 1px solid #C7DAFE;
    flex-wrap: wrap;
  }
  .sup-ctx-dot {
    width: 8px; height: 8px; border-radius: 999px; background: var(--accent);
    animation: sup-pulse 1.8s ease-in-out infinite;
  }
  @keyframes sup-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0.6); }
    50%      { box-shadow: 0 0 0 6px rgba(37,99,235,0); }
  }
  .sup-ctx-lbl { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
  .sup-ctx-select {
    height: 28px; padding: 0 10px; border-radius: 6px;
    border: 1px solid #C7DAFE; background: #fff;
    font-family: var(--font); font-size: 12px; font-weight: 800; color: var(--z-900);
    min-width: 220px;
  }
  .sup-ctx-help { font-size: 11px; color: var(--z-600); }
  .sup-meta-chip {
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px;
    background: #fff; color: var(--z-600); border: 1px solid var(--border);
  }
  .sup-meta-chip.warn { background: var(--warning-soft); color: var(--warning); border-color: transparent; }

  /* 최근 신청 통계치 */
  .sup-stats { padding: 14px; border-radius: 10px; background: var(--z-50); border: 1px solid var(--border); }
  .sup-stats-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .sup-stats-title { font-size: 13px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900); }
  .sup-stats-sub { margin-top: 2px; font-size: 11px; color: var(--z-500); font-weight: 600; }
  .sup-stats-fold {
    height: 26px; padding: 0 10px; border-radius: 6px;
    background: transparent; border: 1px solid var(--border); cursor: pointer;
    font-family: var(--font); font-size: 11px; font-weight: 700; color: var(--z-600);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .sup-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sup-stats-card {
    padding: 10px 12px; border-radius: 8px;
    background: #FFF; border: 1px solid var(--border);
    cursor: pointer; transition: all .15s;
    display: flex; flex-direction: column; gap: 4px;
  }
  .sup-stats-card:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); box-shadow: var(--shadow-xs); }
  .sup-stats-cat { font-size: 10px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; }
  .sup-stats-name {
    font-size: 12px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900);
    line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 32px;
  }
  .sup-stats-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
  .sup-stats-qty { font-size: 10px; color: var(--z-600); font-weight: 700; }
  .sup-stats-qty b { font-size: 12px; font-weight: 800; color: var(--accent); font-feature-settings:"tnum"; }
  .sup-stats-stock { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: var(--z-100); color: var(--z-600); font-feature-settings:"tnum"; }
  .sup-stats-stock.warn   { background: var(--warning-soft); color: var(--warning); }
  .sup-stats-stock.danger { background: var(--danger-soft);  color: var(--danger); }
  .sup-stats-last { font-size: 10px; color: var(--z-400); font-weight: 600; margin-top: 2px; }

  /* 품목 표 */
  .sup-table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: visible; }
  .sup-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sup-table th {
    background: var(--z-50); padding: 8px 10px; text-align: left;
    font-size: 10px; font-weight: 800; color: var(--z-600);
    letter-spacing: 0.04em; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .sup-table th:first-child { padding-left: 14px; text-align: center; }
  .sup-table td { padding: 6px 8px; vertical-align: middle; border-bottom: 1px solid var(--border); }
  .sup-table td:first-child { padding-left: 14px; text-align: center; }
  .sup-table tbody tr:last-child td { border-bottom: 0; }
  .sup-table tbody tr.on td, .sup-table tbody tr:hover td { background: rgba(37,99,235,0.025); }
  .sup-num { font-size: 10px; font-weight: 800; color: var(--z-400); font-feature-settings:"tnum"; }

  .sup-input {
    width: 100%; height: 32px; padding: 0 10px;
    border: 1px solid transparent; border-radius: 6px;
    background: var(--z-100); color: var(--z-900);
    font-family: var(--font); font-size: 12px; font-weight: 600;
  }
  .sup-input:focus { outline: none; background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .sup-input:hover:not(:focus) { background: var(--z-50); }
  select.sup-input { font-weight: 700; }

  /* 자동완성 */
  .sup-name-wrap { position: relative; }
  .sup-auto {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    z-index: 20; background: #FFF; border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow-pop);
    padding: 6px; max-height: 220px; overflow: auto;
  }
  .sup-auto-head { padding: 6px 10px 4px; font-size: 10px; font-weight: 800; color: var(--z-400); letter-spacing: 0.04em; text-transform: uppercase; }
  .sup-auto-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .sup-auto-row:hover { background: var(--accent-soft); }
  .sup-auto-name { font-size: 12px; font-weight: 800; color: var(--z-900); }
  .sup-auto-meta { font-size: 10px; color: var(--z-500); margin-top: 2px; }
  .sup-auto-add {
    font-size: 10px; font-weight: 800; color: var(--accent);
    padding: 3px 8px; background: var(--accent-soft); border-radius: 999px;
    flex-shrink: 0;
  }

  /* 재고 표시 */
  .sup-stock {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 64px; height: 32px; padding: 0 10px;
    background: var(--z-100); border-radius: 6px;
    font-size: 12px; font-weight: 800; color: var(--z-700); font-feature-settings:"tnum";
  }
  .sup-stock.warn   { background: var(--warning-soft); color: var(--warning); }
  .sup-stock.danger { background: var(--danger-soft);  color: var(--danger); }
  .sup-stock.empty  { color: var(--z-400); }

  /* 수량 */
  .sup-qty { display: flex; align-items: center; gap: 2px; }
  .sup-qty-btn {
    width: 28px; height: 32px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; cursor: pointer;
    font-family: var(--font); font-size: 14px; font-weight: 800; color: var(--z-700);
    display: grid; place-items: center;
  }
  .sup-qty-btn:hover { background: var(--z-100); color: var(--z-900); }
  .sup-qty-input {
    width: 44px; height: 32px; padding: 0;
    border: 1px solid var(--border); border-radius: 6px;
    text-align: center; font-family: var(--font); font-size: 13px; font-weight: 800;
    font-feature-settings:"tnum"; color: var(--z-900);
  }
  .sup-qty-input::-webkit-inner-spin-button, .sup-qty-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .sup-qty-input { -moz-appearance: textfield; }
  .sup-unit {
    height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; font-family: var(--font); font-size: 11px; font-weight: 800; color: var(--z-700);
    margin-left: 4px;
  }

  .sup-del {
    width: 24px; height: 24px; border: 0; border-radius: 6px;
    background: transparent; color: var(--z-400); cursor: pointer;
    display: grid; place-items: center;
  }
  .sup-del:hover { background: var(--danger-soft); color: var(--danger); }

  .sup-addrow {
    width: 100%; padding: 10px; border-radius: 0 0 10px 10px;
    background: transparent; border: 0; border-top: 1px dashed var(--border-strong); cursor: pointer;
    color: var(--z-500); font-family: var(--font); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .sup-addrow:hover { background: var(--accent-soft); color: var(--accent); }

  /* 요약 */
  .sup-summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    background: var(--z-50); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .sup-sum-cell {
    padding: 12px 14px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
  }
  .sup-sum-cell:last-child { border-right: 0; }
  .sup-sum-cell .lbl { font-size: 10px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; }
  .sup-sum-cell .v { font-size: 20px; font-weight: 800; letter-spacing: -0.025em; color: var(--z-900); font-feature-settings:"tnum"; line-height: 1.0; }
  .sup-sum-cell .v .u { font-size: 11px; color: var(--z-500); margin-left: 4px; font-weight: 700; }
  .sup-sum-cell .v.danger { color: var(--danger); }

  /* 기타 */
  .sup-extra { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sup-extra-block { display: flex; flex-direction: column; gap: 6px; }
  .sup-extra-block .lbl { font-size: 11px; font-weight: 800; color: var(--z-700); }

  /* ─────────────────────────────── 인사관리 (HR) ─────────────────────────────── */
  /* 사이드바2 group label margin-top 조정 */
  .s2-group-lbl.mt { margin-top: 14px; }

  /* 통합 매핑 배너 — 프리뷰 전용 주석이었으나 사용자 결정(2026-05-26)으로 모든 메뉴에서 숨김 처리 */
  .hr-merge-banner { display: none !important; }
  .hr-merge-banner.shown {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px;
    background: linear-gradient(135deg, #FFF7ED, #FEF3C7);
    border: 1px solid #FED7AA;
  }
  .hr-merge-l { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .hr-merge-kicker { font-size: 11px; font-weight: 800; color: #9A3412; letter-spacing: 0.04em; text-transform: uppercase; }
  .hr-merge-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .hr-merge-chip {
    font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    background: rgba(255,255,255,0.65); color: #9A3412; border: 1px solid rgba(154,52,18,0.15);
    white-space: nowrap;
  }
  .hr-merge-r { flex-shrink: 0; }
  .hr-merge-r b { color: #9A3412; font-size: 14px; font-feature-settings:"tnum"; margin-left: 4px; }

  /* 급여 워크센터 hero */
  .pr-hero {
    background: linear-gradient(135deg, #0B0B0E, #1A1A21);
    color: #fff; border-radius: var(--radius-2xl); padding: 22px 26px;
    display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
  }
  .pr-hero-l { min-width: 0; }
  .pr-hero-kicker { font-size: 11px; font-weight: 800; color: #A1A1AA; letter-spacing: 0.06em; text-transform: uppercase; }
  .pr-hero-title { margin-top: 4px; font-size: 24px; font-weight: 800; letter-spacing: -0.025em; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; flex-wrap: wrap; }
  .pr-hero-frac { font-size: 14px; color: #71717A; font-weight: 700; font-feature-settings:"tnum"; }
  .pr-hero-steps { margin-top: 16px; display: flex; align-items: center; gap: 8px; }
  .pr-step { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; min-width: 0; padding: 8px 6px; border-radius: 8px; }
  .pr-step.done { background: rgba(16,185,129,0.12); }
  .pr-step.on { background: rgba(245,158,11,0.18); }
  .pr-step.pending { background: rgba(255,255,255,0.04); }
  .pr-step-num { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
  .pr-step.done .pr-step-num { background: var(--success); color: #fff; }
  .pr-step.on .pr-step-num { background: var(--warning); color: #fff; }
  .pr-step.pending .pr-step-num { background: rgba(255,255,255,0.1); color: #71717A; }
  .pr-step-lbl { font-size: 11px; font-weight: 800; color: #fff; }
  .pr-step.pending .pr-step-lbl { color: #71717A; }
  .pr-step-ts { font-size: 10px; font-weight: 700; color: #A1A1AA; font-feature-settings:"tnum"; }

  .pr-hero-r { text-align: right; flex-shrink: 0; min-width: 280px; }
  .pr-hero-amt-lbl { font-size: 11px; font-weight: 800; color: #A1A1AA; letter-spacing: 0.04em; }
  .pr-hero-amt { margin-top: 4px; font-size: 36px; font-weight: 800; letter-spacing: -0.035em; font-feature-settings:"tnum"; line-height: 1.0; }
  .pr-hero-amt .u { font-size: 16px; color: #71717A; margin-left: 4px; }
  .pr-hero-amt-sub { margin-top: 6px; font-size: 12px; color: #A1A1AA; font-weight: 600; }
  .pr-hero-amt-sub .up { color: var(--success); font-weight: 800; }
  .pr-hero-cta {
    margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; cursor: pointer;
    font-family: var(--font); font-size: 13px; font-weight: 800; letter-spacing: -0.015em;
  }
  .pr-hero-cta:hover { background: var(--accent-700); }

  /* KPI 그리드 8칸 */
  .pr-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pr-kpi {
    display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: flex-start;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; box-shadow: var(--shadow-xs);
  }
  .pr-kpi-l {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--z-50); display: grid; place-items: center; flex-shrink: 0;
  }
  .pr-kpi-r { min-width: 0; }
  .pr-kpi-r .lbl { font-size: 10.5px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; }
  .pr-kpi-r .v { margin-top: 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.025em; color: var(--z-900); font-feature-settings:"tnum"; line-height: 1.0; }
  .pr-kpi-r .v .u { font-size: 11px; color: var(--z-500); margin-left: 3px; font-weight: 700; }
  .pr-kpi-r .sub { margin-top: 6px; font-size: 10.5px; color: var(--z-500); font-weight: 600; }

  /* 경고 + 모듈 row */
  .pr-row { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; align-items: start; }

  .pr-alerts { padding: 16px 18px 14px; }
  .pr-alert-list { display: grid; gap: 8px; }
  .pr-alert {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    padding: 10px 12px; border-radius: 8px;
    background: var(--z-50); border: 1px solid var(--border);
  }
  .pr-alert.warn   { background: var(--warning-soft); border-color: transparent; }
  .pr-alert.danger { background: var(--danger-soft); border-color: transparent; }
  .pr-alert-tag { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: #fff; color: var(--z-600); letter-spacing: 0.02em; white-space: nowrap; }
  .pr-alert.warn .pr-alert-tag { color: var(--warning); }
  .pr-alert.danger .pr-alert-tag { color: var(--danger); }
  .pr-alert-body { font-size: 12px; color: var(--z-800); line-height: 1.45; min-width: 0; }
  .pr-alert-body b { font-weight: 800; }
  .pr-alert-amt { font-weight: 800; color: var(--danger); margin-left: 4px; font-feature-settings:"tnum"; }
  .pr-alert-act {
    height: 26px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px;
    background: #fff; cursor: pointer; white-space: nowrap;
    font-family: var(--font); font-size: 11px; font-weight: 800; color: var(--z-700);
  }
  .pr-alert.warn .pr-alert-act { border-color: rgba(217,119,6,0.3); color: var(--warning); }
  .pr-alert.danger .pr-alert-act { border-color: rgba(220,38,38,0.3); color: var(--danger); }
  .pr-alert-act:hover { background: var(--z-50); }

  .pr-modules { padding: 16px 18px 14px; }
  .pr-mod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .pr-mod {
    display: flex; flex-direction: column; gap: 4px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; cursor: pointer; text-align: left;
    font-family: var(--font);
    transition: all .15s;
  }
  .pr-mod:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
  .pr-mod-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .pr-mod-name { font-size: 12px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900); }
  .pr-mod-desc { font-size: 10.5px; color: var(--z-500); font-weight: 600; }
  .pr-mod-badge {
    font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
    background: var(--warning-soft); color: var(--warning);
    font-feature-settings:"tnum"; white-space: nowrap;
  }

  /* 급여 모듈 상세 화면 */
  .pr-mod-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .pr-mod-back {
    height: 30px; padding: 0 12px; border-radius: 8px;
    background: var(--z-100); border: 0; cursor: pointer;
    font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--z-700);
  }
  .pr-mod-back:hover { background: var(--z-200); color: var(--z-900); }
  .pr-mod-title-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    margin-bottom: 4px;
  }
  .pr-mod-h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; color: var(--z-900); }
  .pr-mod-sub { margin-top: 4px; font-size: 12px; color: var(--z-500); font-weight: 600; }

  /* 시뮬레이터 / 계산 결과 */
  .pr-sim-net {
    padding: 16px 18px; background: var(--accent-soft); border-radius: 10px; margin-bottom: 12px;
  }
  .pr-sim-net .lbl { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
  .pr-sim-net .v { margin-top: 4px; font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -0.03em; font-feature-settings:"tnum"; line-height: 1.0; }
  .pr-sim-net .v .u { font-size: 14px; color: var(--accent); margin-left: 4px; font-weight: 700; }
  .pr-sim-net .sub { margin-top: 6px; font-size: 11.5px; color: var(--z-700); font-weight: 600; }
  .pr-sim-breakdown { display: grid; gap: 4px; }
  .pr-sim-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border-radius: 6px; background: var(--z-50);
    font-size: 12.5px; font-weight: 700; color: var(--z-700);
  }
  .pr-sim-row b { font-weight: 800; color: var(--z-900); }

  /* HR KPI 공통 */
  .hr-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .hr-kpi {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; box-shadow: var(--shadow-xs);
    display: flex; flex-direction: column; gap: 4px;
  }
  .hr-kpi.tone-warn    { border-left: 3px solid var(--warning); }
  .hr-kpi.tone-success { border-left: 3px solid var(--success); }
  .hr-kpi.tone-danger  { border-left: 3px solid var(--danger); }
  .hr-kpi.tone-accent  { border-left: 3px solid var(--accent); }
  .hr-kpi .lbl { font-size: 11px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; }
  .hr-kpi .v { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; color: var(--z-900); font-feature-settings:"tnum"; line-height: 1.0; }
  .hr-kpi .v .u { font-size: 12px; color: var(--z-500); margin-left: 3px; font-weight: 700; }
  .hr-kpi .sub { font-size: 11px; color: var(--z-500); font-weight: 600; margin-top: 4px; }

  .hr-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; align-items: start; }
  .hr-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .hr-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .hr-split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; align-items: start; }

  /* 구성원 드로어 */
  .hr-drawer-card { padding: 18px 20px; }
  .hr-prof-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .hr-prof-name { font-size: 17px; font-weight: 800; letter-spacing: -0.025em; }
  .hr-prof-dept { margin-top: 2px; font-size: 12px; color: var(--z-600); font-weight: 600; }
  .hr-prof-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; background: var(--z-50); border-radius: 8px; margin-bottom: 14px; }
  .hr-prof-meta > div { display: flex; flex-direction: column; gap: 2px; }
  .hr-prof-meta .lbl { font-size: 10px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; }
  .hr-prof-meta span:not(.lbl) { font-size: 12.5px; font-weight: 800; color: var(--z-900); }
  .hr-prof-section { margin-top: 14px; }
  .hr-prof-section .section-title { font-size: 11px; font-weight: 800; color: var(--z-500); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }

  .hr-timeline { display: grid; gap: 10px; padding-left: 4px; position: relative; }
  .hr-timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--z-200); }
  .hr-tl-row { display: grid; grid-template-columns: 16px 1fr; gap: 12px; align-items: flex-start; position: relative; }
  .hr-tl-dot { width: 12px; height: 12px; border-radius: 999px; background: var(--z-300); margin-top: 4px; margin-left: 2px; position: relative; z-index: 2; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--z-300); }
  .hr-tl-dot.accent  { background: var(--accent);  box-shadow: 0 0 0 1px var(--accent); }
  .hr-tl-dot.warn    { background: var(--warning); box-shadow: 0 0 0 1px var(--warning); }
  .hr-tl-dot.success { background: var(--success); box-shadow: 0 0 0 1px var(--success); }
  .hr-tl-row b { font-size: 12px; font-weight: 800; color: var(--z-900); font-feature-settings:"tnum"; }

  .hr-act { display: grid; gap: 6px; }
  .hr-act-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--z-50); border-radius: 6px; font-size: 12px; color: var(--z-700); font-weight: 600; }

  .hr-move-list { display: grid; gap: 6px; }
  .hr-move-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--z-50); border-radius: 8px; }
  .hr-move-body { flex: 1; font-size: 12.5px; color: var(--z-800); }
  .hr-move-body b { font-weight: 800; }

  .hr-edu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .hr-edu-card { padding: 14px 16px; background: var(--z-50); border-radius: 10px; border: 1px solid var(--border); }
  .hr-edu-name { font-size: 13.5px; font-weight: 800; letter-spacing: -0.015em; color: var(--z-900); margin-bottom: 4px; }
  .hr-edu-bar { height: 6px; background: var(--z-200); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .hr-edu-bar .fill { height: 100%; }
  .hr-edu-bar .fill.tone-success { background: var(--success); }
  .hr-edu-bar .fill.tone-warn    { background: var(--warning); }
  .hr-edu-bar .fill.tone-danger  { background: var(--danger); }

  .data-tbl tbody tr.on td { background: var(--accent-soft); }

  /* 근태 차트 */
  .hr-chart { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; align-items: end; padding: 10px 0; min-height: 160px; }
  .hr-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .hr-bar-stack { display: flex; flex-direction: column; gap: 2px; width: 100%; max-width: 36px; align-items: center; }
  .hr-bar-in, .hr-bar-out {
    width: 100%; border-radius: 4px 4px 0 0; min-height: 4px;
    display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff;
  }
  .hr-bar-in  { background: var(--success); }
  .hr-bar-out { background: #94A3B8; border-radius: 0 0 4px 4px; }
  .hr-bar-h { font-size: 10px; font-weight: 700; color: var(--z-500); font-feature-settings:"tnum"; }
  .hr-chart-legend { display: flex; gap: 14px; margin-top: 6px; padding: 0 4px; font-size: 11px; font-weight: 700; color: var(--z-600); }
  .hr-leg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .hr-leg-dot.in  { background: var(--success); }
  .hr-leg-dot.out { background: #94A3B8; }

  /* 부서별 바 */
  .hr-dept-list { display: grid; gap: 8px; }
  .hr-dept-row { display: grid; grid-template-columns: 80px 1fr 160px; gap: 12px; align-items: center; }
  .hr-dept-name { font-size: 12px; font-weight: 800; color: var(--z-800); }
  .hr-dept-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--z-100); }
  .hr-dept-seg.ok    { background: var(--success); }
  .hr-dept-seg.late  { background: var(--warning); }
  .hr-dept-seg.leave { background: var(--accent); }
  .hr-dept-seg.off   { background: var(--danger); }
  .hr-dept-vals { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 800; font-feature-settings:"tnum"; }
  .hr-dept-vals .ok    { color: var(--success); }
  .hr-dept-vals .late  { color: var(--warning); }
  .hr-dept-vals .leave { color: var(--accent); }
  .hr-dept-vals .off   { color: var(--danger); }

  /* 근무표 그리드 */
  .hr-sched-banner {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 18px; border-radius: 10px;
    background: linear-gradient(135deg, #1A1A21, #27272A); color: #fff;
  }
  .hr-sched-kicker { font-size: 11px; font-weight: 800; color: #A1A1AA; letter-spacing: 0.06em; text-transform: uppercase; }
  .hr-sched-title { margin-top: 4px; font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
  .hr-sched-grid {
    display: grid;
    grid-template-columns: 90px repeat(14, minmax(40px, 1fr));
  }
  .hr-sched-corner, .hr-sched-h {
