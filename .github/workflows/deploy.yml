name: Standalone Build

# 현재 Node/SQLite 배포물 검사. 실제 서버 배포는 기존 deploy:allerp 절차로 수행합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: standalone-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_PATH: ${{ github.workspace }}/.scratch-r/ci/allerp.sqlite
      SESSION_SECRET: isolated-ci-build-secret-not-for-production-2026
      DISABLE_CRON: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:cron
      - run: npm run verify:regressions
      - run: npm run build
      - name: Package standalone runtime
        run: |
          mkdir -p .next/standalone/.next/static .next/standalone/public .next/standalone/lib/db/migrations
          cp -R .next/static/. .next/standalone/.next/static/
          cp -R public/. .next/standalone/public/
          cp -R lib/db/migrations/. .next/standalone/lib/db/migrations/
          cp lib/cron-schedules.mjs .next/standalone/lib/cron-schedules.mjs
          cp server.mjs .next/standalone/server.mjs
          cp package.json package-lock.json .next/standalone/
          cd .next/standalone && npm ci --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: allerp-standalone
          path: .next/standalone/
          include-hidden-files: true
          retention-days: 7
