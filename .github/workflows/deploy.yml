name: Deploy (Cloudflare)

# main 에 푸시되면 Cloudflare 워커(erp-pchos)로 자동 빌드·배포한다.
# 로컬 `npm run deploy`(scripts/deploy.mjs)와 동일한 단계를 비대화로 재현:
#   .env.local 복원 → build:cloudflare(OpenNext) → deploy:cloudflare(wrangler)
#
# 필요한 저장소 Secret (Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN : Cloudflare API 토큰 (워커 배포 권한)
#   - DOTENV_LOCAL         : 로컬 .env.local 파일 "전체 내용"을 그대로 붙여넣기
#                            (빌드 시 NEXT_PUBLIC_* 클라이언트 변수가 여기서 주입됨)
#   - CLOUDFLARE_ACCOUNT_ID: (선택) 토큰이 여러 계정에 걸쳐 있을 때만 필요
#
# Secret 이 아직 없으면 워크플로는 실패하지 않고 안내 메시지와 함께 스킵된다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOTENV_LOCAL: ${{ secrets.DOTENV_LOCAL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard - 배포 Secret 설정 여부 확인
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$DOTENV_LOCAL" ]; then
            echo "::warning::배포 Secret(CLOUDFLARE_API_TOKEN / DOTENV_LOCAL)이 아직 설정되지 않아 배포를 건너뜁니다. 저장소 Settings → Secrets and variables → Actions 에서 추가하면 다음 푸시부터 자동 배포됩니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 20
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Restore .env.local (build-time NEXT_PUBLIC_* 주입)
        if: steps.guard.outputs.skip == 'false'
        run: printf '%s\n' "$DOTENV_LOCAL" > .env.local

      - name: Build (OpenNext → Cloudflare)
        if: steps.guard.outputs.skip == 'false'
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare
        if: steps.guard.outputs.skip == 'false'
        run: npm run deploy:cloudflare

      - name: Cleanup secret file
        if: always()
        run: rm -f .env.local
