name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # 30분 안에 설치+빌드+모바일+데스크톱을 모두 욱여넣어 매번 타임아웃 취소되던 문제를 해결:
    #  (1) 모바일/데스크톱을 병렬 매트릭스로 분리해 각자 독립 예산을 갖게 하고
    #  (2) Playwright 브라우저와 Next 빌드 캐시로 반복 실행을 단축하며
    #  (3) 작업 예산을 60분으로 상향.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mobile
            projects: "--project=mobile-chromium --project=mobile-android-chromium"
          - suite: desktop
            projects: "--project=desktop-chromium"

    env:
      # Supabase (CI용 공개 anon key — read-only 테스트 계정 권장)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # E2E 전용 자격증명 (실 로그인 테스트용 — 없으면 mock 세션으로 대체)
      E2E_TEST_USER_ID: ${{ secrets.E2E_TEST_USER_ID }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # 푸시 (헤드리스에서는 stub 처리됨)
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextcache-

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run E2E tests (${{ matrix.suite }})
        run: npm run test:e2e -- ${{ matrix.projects }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.suite }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.suite }}-${{ github.run_number }}
          path: test-results/**/*.zip
          retention-days: 14
          if-no-files-found: ignore
