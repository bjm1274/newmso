name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # 30분 안에 설치+빌드+모바일+데스크톱을 모두 욱여넣어 매번 타임아웃 취소되던 문제를 해결:
    #  (1) 모바일/데스크톱을 병렬 매트릭스로 분리해 각자 독립 예산을 갖게 하고
    #  (2) Playwright 브라우저와 Next 빌드 캐시로 반복 실행을 단축하며
    #  (3) 작업 예산을 60분으로 상향.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mobile
            projects: "--project=mobile-chromium --project=mobile-android-chromium"
          - suite: desktop
            projects: "--project=desktop-chromium"

    env:
      # Supabase (CI용 공개 anon key — read-only 테스트 계정 권장)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # E2E 전용 자격증명 (실 로그인 테스트용 — 없으면 mock 세션으로 대체)
      E2E_TEST_USER_ID: ${{ secrets.E2E_TEST_USER_ID }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # 푸시 (헤드리스에서는 stub 처리됨)
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextcache-

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 로컬 D1 시드(scripts/seed-e2e-d1.mjs)는 CI에서 의도적으로 건너뛴다.
      #  - CI는 `next build` + `next start`(production)로 돌기 때문에
      #    next.config.ts의 initOpenNextCloudflareForDev()가 비활성이고,
      #    lib/db/get-binding.ts의 로컬 폴백도 NODE_ENV=development에서만 동작한다.
      #    → CI 러너에는 D1 바인딩 자체가 없으므로 시드해도 앱이 읽지 못한다.
      #  - 따라서 CI의 E2E는 tests/e2e/helpers.ts의 mockSupabase()/seedSession()
      #    기반 UI 검증 범위로 한정된다. 시드가 필요한 스펙
      #    (tests/e2e/seeded-login.desktop.spec.ts)은 CI에서 자동 skip된다.
      #  - `npm run test:e2e`가 호출하는 시드 스텝은 `--if-local` 플래그로
      #    CI 환경변수를 감지해 조용히 no-op 처리된다.
      #  - CI에서도 실제 D1을 쓰려면 `npx wrangler dev`(miniflare) 기반 서버로
      #    webServer를 바꾸고 여기서 `npm run test:e2e:seed`를 추가해야 한다.
      - name: Run E2E tests (${{ matrix.suite }})
        run: npm run test:e2e -- ${{ matrix.projects }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.suite }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.suite }}-${{ github.run_number }}
          path: test-results/**/*.zip
          retention-days: 14
          if-no-files-found: ignore
