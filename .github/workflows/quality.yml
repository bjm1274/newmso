name: Quality Gate

# 타입체크·린트·D1 정책 검증을 PR 과 main 푸시에서 강제한다.
#
# 8차 전수조사(2026-08-03) 이전에는 이 세 가지가 CI 어디에도 없었다.
# jscpd(hygiene.yml)만 돌았고 그마저 continue-on-error 라 아무것도 막지 못했다.
# 그 사이 정책 회귀·타입 오류가 배포까지 그대로 나갔다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Policies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --incremental false: tsconfig.tsbuildinfo 캐시에 기대지 않고 매번 전체 검사한다.
      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Lint
        run: npm run lint

      # Node 서버 스케줄 ↔ 실제 라우트 ↔ 운영 패널 연결 검사.
      # 파일만 읽는 정적 검사라 서버·DB 없이 CI 에서 그대로 돌릴 수 있다.
      - name: Verify cron wiring
        run: npm run verify:cron


      - name: SQLite regression tests
        run: npm run verify:regressions
