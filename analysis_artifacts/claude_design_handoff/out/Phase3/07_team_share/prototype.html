<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무공유 협업센터 — Prototype</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0D0D10;color:#F4F4F5;min-height:100vh;
  display:flex;flex-direction:column;
}

/* ── Control Bar ── */
.control-bar{
  background:#18181B;border-bottom:1px solid #27272A;
  padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  flex-shrink:0;
}
.control-bar h1{font-size:13px;font-weight:700;color:#F4F4F5;margin-right:4px}
.control-bar span{font-size:11px;color:#71717A}

.toggle-group{display:flex;gap:4px;background:#09090B;padding:4px;border-radius:8px}
.toggle-btn{
  padding:5px 12px;border-radius:6px;border:none;font-size:12px;font-weight:500;
  font-family:inherit;cursor:pointer;transition:all 150ms ease;
  background:transparent;color:#71717A;
}
.toggle-btn.active{background:#2563EB;color:#fff}
.toggle-btn:hover:not(.active){background:#27272A;color:#F4F4F5}

.dark-toggle{
  margin-left:auto;padding:5px 12px;border-radius:6px;border:1px solid #27272A;
  font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;
  background:transparent;color:#A1A1AA;transition:all 150ms ease;
}
.dark-toggle:hover{background:#27272A;color:#F4F4F5}
.dark-toggle.active{background:#27272A;color:#FBBF24;border-color:#3F3F46}

/* ── Viewport ── */
.viewport-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:auto;background:#09090B;
}

.frame-label{
  text-align:center;font-size:11px;color:#52525B;margin-bottom:8px;letter-spacing:.04em
}

.device-frame{
  position:relative;
  box-shadow:0 0 0 1px #27272A,0 20px 60px rgba(0,0,0,.6);
}
.device-frame.mobile-frame{
  border-radius:40px;overflow:hidden;
  border:8px solid #1C1C1F;
  box-shadow:0 0 0 1px #3F3F46,0 24px 80px rgba(0,0,0,.7);
}
.device-frame.mobile-frame::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:100px;height:24px;background:#1C1C1F;border-radius:0 0 16px 16px;
  z-index:10;
}

iframe{
  display:block;border:none;background:#fff;
}

/* ── Info Bar ── */
.info-bar{
  background:#18181B;border-top:1px solid #27272A;
  padding:8px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;
}
.info-item{font-size:11px;color:#52525B;display:flex;align-items:center;gap:5px}
.info-item strong{color:#A1A1AA}
.info-dot{width:6px;height:6px;border-radius:50%;background:#2563EB;flex-shrink:0}
.info-dot.green{background:#10B981}
.info-dot.yellow{background:#F59E0B}
</style>
</head>
<body>

<div class="control-bar">
  <h1>업무공유 협업센터</h1>
  <span>work_team_share · Phase 3 · Group ⑦</span>

  <div class="toggle-group" role="group" aria-label="뷰 모드 선택">
    <button class="toggle-btn active" id="btn-pc" onclick="setView('pc')" aria-pressed="true">
      PC
    </button>
    <button class="toggle-btn" id="btn-mobile" onclick="setView('mobile')" aria-pressed="false">
      Mobile
    </button>
    <button class="toggle-btn" id="btn-tablet" onclick="setView('tablet')" aria-pressed="false">
      Tablet
    </button>
  </div>

  <button class="dark-toggle" id="dark-toggle" onclick="toggleDark()" aria-pressed="false">
    다크모드
  </button>
</div>

<div class="viewport-wrap" id="viewport-wrap">
  <div>
    <div class="frame-label" id="frame-label">PC — 1440 × 860</div>
    <div class="device-frame" id="device-frame">
      <iframe id="preview-frame" src="PC.html" width="1440" height="860" title="업무공유 협업센터 미리보기"></iframe>
    </div>
  </div>
</div>

<div class="info-bar">
  <div class="info-item"><div class="info-dot" aria-hidden="true"></div><strong>탭</strong> 자료 · 인수인계 · 팀할일 (카운트 뱃지)</div>
  <div class="info-item"><div class="info-dot green" aria-hidden="true"></div><strong>마스터-디테일</strong> PC split / Mobile inline transition</div>
  <div class="info-item"><div class="info-dot yellow" aria-hidden="true"></div><strong>등록</strong> PC modal / Mobile bottom sheet</div>
  <div class="info-item" style="margin-left:auto"><strong>접근성</strong> WCAG AA · 키보드 · 터치 44px+</div>
</div>

<script>
const configs = {
  pc:     { src:'PC.html',     w:1440, h:860,  label:'PC — 1440 × 860',     mobile:false },
  mobile: { src:'Mobile.html', w:390,  h:844,  label:'Mobile — 390 × 844',  mobile:true  },
  tablet: { src:'Mobile.html', w:768,  h:1024, label:'Tablet — 768 × 1024 (Mobile 확장)', mobile:false },
};

let currentView = 'pc';
let isDark = false;

function setView(v) {
  currentView = v;
  const cfg = configs[v];
  const frame = document.getElementById('preview-frame');
  const deviceFrame = document.getElementById('device-frame');

  frame.src = cfg.src;
  frame.width = cfg.w;
  frame.height = cfg.h;
  document.getElementById('frame-label').textContent = cfg.label;

  // Mobile device frame
  deviceFrame.classList.toggle('mobile-frame', cfg.mobile);

  // Apply dark to new iframe after load
  frame.onload = () => applyDark();

  // Toggle buttons
  ['pc','mobile','tablet'].forEach(id => {
    const btn = document.getElementById('btn-'+id);
    btn.classList.toggle('active', id === v);
    btn.setAttribute('aria-pressed', id === v);
  });

  // Scale down PC for small screens
  const wrap = document.getElementById('viewport-wrap');
  const available = wrap.clientWidth - 48;
  if (cfg.w > available) {
    const scale = available / cfg.w;
    deviceFrame.style.transform = `scale(${scale})`;
    deviceFrame.style.transformOrigin = 'top center';
    deviceFrame.style.marginBottom = `${-(cfg.h * (1 - scale))}px`;
  } else {
    deviceFrame.style.transform = '';
    deviceFrame.style.marginBottom = '';
  }
}

function toggleDark() {
  isDark = !isDark;
  const btn = document.getElementById('dark-toggle');
  btn.classList.toggle('active', isDark);
  btn.setAttribute('aria-pressed', isDark);
  applyDark();
}

function applyDark() {
  try {
    const iframeDoc = document.getElementById('preview-frame').contentDocument
      || document.getElementById('preview-frame').contentWindow.document;
    if (isDark) {
      iframeDoc.documentElement.classList.add('dark');
    } else {
      iframeDoc.documentElement.classList.remove('dark');
    }
  } catch(e) {
    // cross-origin: ignore
  }
}

// Responsive rescale on resize
window.addEventListener('resize', () => setView(currentView));

// Init
window.addEventListener('load', () => {
  document.getElementById('preview-frame').onload = applyDark;
});
</script>
</body>
</html>
