<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SY INC. MSO — 디자인 리디자인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; -webkit-font-smoothing: antialiased;
    letter-spacing: -0.015em; line-height: 1.55;
  }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 10px; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="nb-icons.jsx"></script>
<script type="text/babel" src="nb-sidebar.jsx"></script>
<script type="text/babel" src="nb-screens.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#2563eb",
  "dark": false,
  "sidebarWidth": 72,
  "density": "comfortable",
  "showSubLabel": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { accent, dark, density } = tweaks;

  const [mainMenu, setMainMenu] = React.useState('내정보');
  const [subView, setSubView] = React.useState('구성원');
  const [isMobile, setIsMobile] = React.useState(false);

  React.useEffect(() => {
    const mq = window.matchMedia('(max-width: 767px)');
    const sync = () => setIsMobile(mq.matches);
    sync();
    mq.addEventListener('change', sync);
    return () => mq.removeEventListener('change', sync);
  }, []);

  const handleMenuChange = (menu) => {
    setMainMenu(menu);
    const subs = SUB_MENUS[menu] || [];
    if (subs.length > 0) setSubView(subs[0].id);
  };

  const bg = dark ? '#0d0d10' : '#f8f8f9';
  const hasSub = (SUB_MENUS[mainMenu] || []).length > 0;

  return (
    <div style={{
      display: 'flex', height: '100dvh', width: '100vw',
      background: bg, overflow: 'hidden',
      fontFamily: "'Pretendard', -apple-system, sans-serif",
    }}>
      {/* Desktop Sidebar */}
      {!isMobile && (
        <DesktopSidebar
          mainMenu={mainMenu}
          onMenuChange={handleMenuChange}
          dark={dark}
          accent={accent}
        />
      )}

      {/* Submenu */}
      {!isMobile && hasSub && (
        <SubmenuPanel
          mainMenu={mainMenu}
          subView={subView}
          onSubViewChange={setSubView}
          dark={dark}
          accent={accent}
        />
      )}

      {/* Content */}
      <div style={{
        flex: 1, minWidth: 0, height: '100%',
        overflowY: isMobile ? 'auto' : 'hidden',
        display: 'flex', flexDirection: 'column',
        paddingBottom: isMobile ? 68 : 0,
      }}>
        <ContentScreen
          mainMenu={mainMenu}
          subView={subView}
          dark={dark}
          accent={accent}
          density={density}
        />
      </div>

      {/* Mobile tab bar */}
      {isMobile && (
        <MobileTabBar
          mainMenu={mainMenu}
          onMenuChange={handleMenuChange}
          dark={dark}
          accent={accent}
        />
      )}

      {/* Tweaks panel */}
      <TweaksPanel>
        <TweakSection label="테마">
          <TweakColor id="accent" label="액센트 컬러" />
          <TweakToggle id="dark" label="다크 모드" />
        </TweakSection>
        <TweakSection label="레이아웃">
          <TweakRadio id="density" label="밀도"
            options={[
              { label: '컴팩트', value: 'compact' },
              { label: '기본', value: 'comfortable' },
              { label: '넓게', value: 'spacious' },
            ]}
          />
          <TweakToggle id="showSubLabel" label="서브메뉴 레이블 표시" />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
